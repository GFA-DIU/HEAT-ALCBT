<div class="size-full space-y-4 flex flex-col">
  <div class="space-y-1 shrink-0">
    <h6 class="h6-title text-[var(--text--strong-950)]">Map Your Columns</h6>
    <p class="paragraph-small text-[var(--text--sub-600)]">
      Map your file columns to BEAT data fields
    </p>
  </div>

  <!-- Status Alert -->
  <div id="map-status-alert"
    class="w-full flex items-center justify-center gap-3 px-12 py-3 rounded-md text-[var(--state--warning--base)] bg-[var(--state--warning--lighter)]">
    <span data-icon="alert-fill" data-size="20"></span>
    <span class="label-small text-[var(--text--strong-950)]">
      You have <span id="mismatch-count">2</span> column field mismatch •
      <span class="paragraph-small">Please fix this to continue</span>
    </span>
  </div>

  <!-- Table Container -->
  <div class="w-full flex-1 hide-scrollbar overflow-auto rounded-lg">
    <table class="table w-full relative border-collapse">
      <thead class="bg-[var(--bg--weak-50)] sticky top-0 z-10 text-[var(--text--sub-600)] label-small">
        <tr>
          <th class="w-[33%] py-3 px-4 text-left font-normal border-b-0">Your file’s imported column</th>
          <th class="w-[40.5%] py-3 px-4 text-left font-normal border-b-0">System required headers</th>
          <th class="py-3 px-4 text-left font-normal border-b-0">Type</th>
          <th class="py-3 px-4 text-left font-normal border-b-0">Status</th>
        </tr>
      </thead>
      <tbody id="map-fields-body" class="text-[var(--text--strong-950)] paragraph-small">
        <!-- Rows will be injected via JS -->
      </tbody>
    </table>
  </div>
</div>

<!-- Template for Mismatch Row -->
<template id="template-row-mismatch">
  <tr class="border-b border-[var(--stroke--soft-200)] last:border-0 hover:bg-[var(--bg--weak-50)] transition-colors">
    <td class="px-4 py-3 font-medium col-file"></td>
    <td class="px-4 py-3">
      <select class="select select-bordered select-sm w-full h-9 bg-white focus:outline-none col-select"
        onchange="window.handleMapChange(this)">
        <option disabled selected>-- Select Header --</option>
        <option value="building_identifier">building_identifier</option>
        <option value="building_address">building_address</option>
        <option value="region_state">region_state</option>
        <option value="building_city">building_city</option>
        <option value="country">country</option>
      </select>
    </td>
    <td class="px-4 py-3 col-type"></td>
    <td class="px-4 py-3">
      <span data-icon="error-warning-fill" data-size="26"
        class="text-[var(--state--warning--base)] col-status-icon"></span>
    </td>
  </tr>
</template>

<!-- Template for Success Row -->
<template id="template-row-success">
  <tr class="border-b border-[var(--stroke--soft-200)] last:border-0 hover:bg-[var(--bg--weak-50)] transition-colors">
    <td class="px-4 py-3 font-medium col-file"></td>
    <td class="px-4 py-3">
      <div
        class="h-9 px-3 py-2 border border-[var(--stroke--sub-300)] rounded-md bg-[var(--bg--weak-50)] text-[var(--text--main-900)] text-sm w-full truncate col-mapped">
        <!-- Mapped Value -->
      </div>
    </td>
    <td class="px-4 py-3 col-type"></td>
    <td class="px-4 py-3">
      <span data-icon="select-box-circle-fill" data-size="20" class="text-[var(--state--success--base)]"></span>
    </td>
  </tr>
</template>

<script>
  (function () {
    // Mock Data
    const columns = [
      { id: '1', fileColumn: 'Building ID', requiredHeader: 'building_identifier', type: 'Text', status: 'success' },
      { id: '2', fileColumn: 'Address Line 1', requiredHeader: null, type: 'Text', status: 'mismatch' },
      { id: '3', fileColumn: 'City Name', requiredHeader: null, type: 'Text', status: 'mismatch' },
      { id: '4', fileColumn: 'Country Code', requiredHeader: 'country', type: 'Text', status: 'success' },
    ];

    const tbody = document.getElementById('map-fields-body');
    const mismatchTemplate = document.getElementById('template-row-mismatch');
    const successTemplate = document.getElementById('template-row-success');
    let mismatchCount = 0;

    if (tbody && mismatchTemplate && successTemplate) {
      tbody.innerHTML = ''; // clear

      columns.forEach(col => {
        let clone;
        if (col.status === 'success') {
          clone = successTemplate.content.cloneNode(true);
          clone.querySelector('.col-mapped').textContent = col.requiredHeader;
        } else {
          clone = mismatchTemplate.content.cloneNode(true);
          const select = clone.querySelector('.col-select');
          select.dataset.id = col.id; // Store ID for logic
          mismatchCount++;
        }

        clone.querySelector('.col-file').textContent = col.fileColumn;
        clone.querySelector('.col-type').textContent = col.type;

        tbody.appendChild(clone);
      });

      updateStatus(mismatchCount);
      if (window.IconComponent) window.IconComponent.initialize();
    }

    // Handle Select Change
    window.handleMapChange = (select) => {
      const row = select.closest('tr');
      const statusCell = row.querySelector('td:last-child');

      // Show loading state
      statusCell.innerHTML = `<span data-icon="loader-2-fill" data-size="18" class="text-[var(--icon--sub-600)] animate-spin"></span>`;
      if (window.IconComponent) window.IconComponent.initialize();
      select.disabled = true;

      // Simulate Async Validation
      setTimeout(() => {
        // Replace with mapped div
        const val = select.value;
        const mappedDiv = document.createElement('div');
        mappedDiv.className = 'h-9 px-3 py-2 border border-[var(--stroke--sub-300)] rounded-md bg-[var(--bg--weak-50)] text-[var(--text--main-900)] text-sm w-full truncate';
        mappedDiv.textContent = val;
        select.parentElement.replaceChild(mappedDiv, select);

        // Update Status Icon
        statusCell.innerHTML = `<span data-icon="select-box-circle-fill" data-size="20" class="text-[var(--state--success--base)]"></span>`;
        if (window.IconComponent) window.IconComponent.initialize();

        // Update Global Status
        const countEl = document.getElementById('mismatch-count');
        if (countEl) {
          let count = parseInt(countEl.textContent || '0');
          updateStatus(Math.max(0, count - 1));
        }

      }, 1500);
    };

    function updateStatus(count) {
      const alertBox = document.getElementById('map-status-alert');
      const countSpan = document.getElementById('mismatch-count');

      if (countSpan) countSpan.textContent = count;

      if (alertBox) {
        if (count > 0) {
          alertBox.className = 'w-full flex items-center justify-center gap-3 px-12 py-3 text-[var(--state--warning--base)] bg-[var(--state--warning--lighter)] rounded-md transition-colors';
          alertBox.innerHTML = `
                <span data-icon="alert-fill" data-size="20"></span>
                <span class="label-small text-[var(--text--strong-950)]">
                  You have <span id="mismatch-count">${count}</span> column field mismatch • 
                  <span class="paragraph-small">Please fix this to continue</span>
                </span>
             `;
        } else {
          alertBox.className = 'w-full flex items-center justify-center gap-3 px-12 py-3 text-[var(--state--success--base)] bg-[var(--state--success--lighter)] rounded-md transition-colors';
          alertBox.innerHTML = `
                <span data-icon="select-box-circle-fill" data-size="20"></span>
                <span class="label-small text-[var(--text--strong-950)]">
                   All columns mapped successfully
                </span>
             `;
        }
        if (window.IconComponent) window.IconComponent.initialize();
      }
    }

  })();
</script>

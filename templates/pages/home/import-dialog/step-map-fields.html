<div class="size-full space-y-4 flex flex-col">
  <div class="space-y-1 shrink-0">
    <h6 class="h6-title text-[var(--text--strong-950)]">Map Your Columns</h6>
    <p class="paragraph-small text-[var(--text--sub-600)]">
      Review the column mapping detected from your file. All columns matched automatically.
    </p>
  </div>

  <!-- Status Alert -->
  <div id="map-status-alert"
    class="w-full flex items-center justify-center gap-3 px-12 py-3 rounded-md text-[var(--state--success--base)] bg-[var(--state--success--lighter)]">
    <span data-icon="select-box-circle-fill" data-size="20"></span>
    <span class="label-small text-[var(--text--strong-950)]">
      All columns mapped automatically from the template
    </span>
  </div>

  <!-- Table Container -->
  <div class="w-full flex-1 hide-scrollbar overflow-auto rounded-lg">
    <table class="table w-full relative border-collapse">
      <thead class="bg-[var(--bg--weak-50)] sticky top-0 z-10 text-[var(--text--sub-600)] label-small">
        <tr>
          <th class="w-[30%] py-3 px-4 text-left font-normal border-b-0">Tab</th>
          <th class="w-[40%] py-3 px-4 text-left font-normal border-b-0">Excel column header</th>
          <th class="py-3 px-4 text-left font-normal border-b-0">Value</th>
        </tr>
      </thead>
      <tbody id="map-fields-body" class="text-[var(--text--strong-950)] paragraph-small">
        <!-- Populated by JS -->
      </tbody>
    </table>
  </div>
</div>

<template id="template-row-map">
  <tr class="border-b border-[var(--stroke--soft-200)] last:border-0 hover:bg-[var(--bg--weak-50)] transition-colors">
    <td class="px-4 py-3 text-[var(--text--sub-600)] col-tab"></td>
    <td class="px-4 py-3 font-medium col-header"></td>
    <td class="px-4 py-3 col-value"></td>
  </tr>
</template>

<template id="template-row-map-section">
  <tr class="bg-[var(--bg--weak-50)]">
    <td colspan="3" class="px-4 py-2 label-small text-[var(--text--sub-600)] col-section"></td>
  </tr>
</template>

<template id="template-row-map-count">
  <tr class="border-b border-[var(--stroke--soft-200)] last:border-0 hover:bg-[var(--bg--weak-50)] transition-colors">
    <td class="px-4 py-3 text-[var(--text--sub-600)] col-tab"></td>
    <td class="px-4 py-3 font-medium col-header"></td>
    <td class="px-4 py-3 col-value">
      <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-[var(--bg--weak-50)] border border-[var(--stroke--soft-200)] paragraph-x-small col-badge"></span>
    </td>
  </tr>
</template>

<script>
  (function () {
    const state = window.importState || {};
    const t1 = state.tab1 || {};
    const t2 = state.tab2 || {};
    const t3 = state.tab3 || {};

    const rows = [
      { tab: 'Name & Location',              header: 'Building name or Code',                           value: t1.building_name },
      { tab: 'Name & Location',              header: 'Address',                                         value: t1.address },
      { tab: 'Name & Location',              header: 'Country',                                         value: t1.country },
      { tab: 'Name & Location',              header: 'Region or State',                                 value: t1.region },
      { tab: 'Name & Location',              header: 'City',                                            value: t1.city },
      { tab: 'Name & Location',              header: 'Longitude',                                       value: t1.longitude },
      { tab: 'Name & Location',              header: 'Latitude',                                        value: t1.latitude },
      { tab: 'Building Details',             header: 'Building type',                                   value: t2.building_type },
      { tab: 'Building Details',             header: 'Area climate type',                               value: t2.climate_type },
      { tab: 'Building Details',             header: 'Assessment period (years)',                       value: t2.assessment_period },
      { tab: 'Building Details',             header: 'Total floor area (m²)',                           value: t2.total_floor_area },
      { tab: 'Building Details',             header: 'Conditioned floor area (m²)',                     value: t2.conditioned_floor_area },
      { tab: 'Building Details',             header: 'Construction year',                               value: t2.construction_year },
      { tab: 'Building Details',             header: 'Floors below ground',                             value: t2.floors_below_ground },
      { tab: 'Building Details',             header: 'Has certification',                               value: t2.has_certification },
      { tab: 'Building Details',             header: 'Has BoQ / design drawings',                       value: t2.has_boq },
      { tab: 'Operational Schedule & Temp',  header: 'Number of residents',                             value: t3.num_residents },
      { tab: 'Operational Schedule & Temp',  header: 'Annual operating schedule (Hours/Day)',           value: t3.hours_per_workday },
      { tab: 'Operational Schedule & Temp',  header: 'Annual operating schedule (Days/Week)',           value: t3.workdays_per_week },
      { tab: 'Operational Schedule & Temp',  header: 'Annual operating schedule (Weeks/Year)',          value: t3.weeks_per_year },
      { tab: 'Operational Schedule & Temp',  header: 'Room heating temperature',                        value: t3.heating_temp },
      { tab: 'Operational Schedule & Temp',  header: 'Room heating temperature unit',                   value: t3.heating_temp_unit },
      { tab: 'Operational Schedule & Temp',  header: 'Room cooling temperature',                        value: t3.cooling_temp },
      { tab: 'Operational Schedule & Temp',  header: 'Room cooling temperature unit',                   value: t3.cooling_temp_unit },
      { tab: 'Operational Schedule & Temp',  header: 'Renewable energy installation (%)',               value: t3.renewable_energy_percent },
      { tab: 'Operational Schedule & Temp',  header: 'Building smart system installation',              value: t3.building_smart_system },
    ];

    const tbody = document.getElementById('map-fields-body');
    const template = document.getElementById('template-row-map');
    const templateSection = document.getElementById('template-row-map-section');
    const templateCount = document.getElementById('template-row-map-count');

    if (tbody && template) {
      tbody.innerHTML = '';

      // Render tab1/2/3 rows
      rows.forEach(row => {
        const clone = template.content.cloneNode(true);
        clone.querySelector('.col-tab').textContent = row.tab;
        clone.querySelector('.col-header').textContent = row.header;
        clone.querySelector('.col-value').textContent = row.value || '—';
        tbody.appendChild(clone);
      });

      // Helper: add section divider
      function addSection(label) {
        const clone = templateSection.content.cloneNode(true);
        clone.querySelector('.col-section').textContent = label;
        tbody.appendChild(clone);
      }

      // Helper: add a tab row with row count badge
      function addCountRow(tabGroup, tabName, count) {
        const clone = templateCount.content.cloneNode(true);
        clone.querySelector('.col-tab').textContent = tabGroup;
        clone.querySelector('.col-header').textContent = tabName;
        clone.querySelector('.col-badge').textContent = count + (count === 1 ? ' row' : ' rows');
        tbody.appendChild(clone);
      }

      // Tab labels
      const COOLING_LABELS = {
        'window ac': 'Window AC', 'split ac': 'Split AC', 'vrf': 'VRF',
        'packagedductab': 'Packaged / Ducted', 'water cooled': 'Water-cooled Chiller', 'air cooled': 'Air-cooled Chiller',
      };
      const VENT_LABELS = {
        'ahu': 'AHU', 'fcu': 'FCU', 'ceilingwa': 'Cassette AC', 'doas': 'DOAS', 'ceilingex': 'Ceiling / Exhaust Fan',
      };
      const LIGHTING_LABELS = {
        'led': 'LED', 'fluorescent': 'Fluorescent', 'cfl': 'CFL', 'incandescent': 'Incandescent', 'hid': 'HID',
      };
      const HWS_LABELS = {
        'heat-pump': 'Heat Pump', 'boiler': 'Boiler', 'water-heater': 'Water Heater',
      };

      // Cooling Systems
      const cooling = state.coolingSystems || [];
      if (cooling.length > 0) {
        addSection('Cooling Systems');
        cooling.forEach(s => addCountRow('Cooling Systems', COOLING_LABELS[s.tab] || s.tab, s.rows.length));
      }

      // Ventilation Systems
      const vent = state.ventilationSystems || [];
      if (vent.length > 0) {
        addSection('Ventilation Systems');
        vent.forEach(s => addCountRow('Ventilation Systems', VENT_LABELS[s.tab] || s.tab, s.rows.length));
      }

      // Lighting Systems
      const lighting = state.lightingSystems || [];
      if (lighting.length > 0) {
        addSection('Lighting Systems');
        lighting.forEach(s => addCountRow('Lighting Systems', LIGHTING_LABELS[s.tab] || s.tab, s.rows.length));
      }

      // Lift & Escalator
      const lift = state.liftEscalator || [];
      if (lift.length > 0) {
        addSection('Lift & Escalator');
        addCountRow('Lift & Escalator', 'Lift & Escalator System', lift.length);
      }

      // Hot Water Systems
      const hws = state.hotWaterSystems || [];
      if (hws.length > 0) {
        addSection('Hot Water Systems');
        hws.forEach(s => addCountRow('Hot Water Systems', HWS_LABELS[s.tab] || s.tab, s.rows.length));
      }

      // Energy Carriers
      const ec = state.energyCarriers || [];
      if (ec.length > 0) {
        addSection('Operational Energy Carriers');
        addCountRow('Energy Carriers', 'Operational Energy Carriers', ec.length);
      }

      // Structural Components
      const sc = state.structuralComponents || [];
      if (sc.length > 0) {
        addSection('Structural Components');
        addCountRow('Structural Components', 'By Component', sc.length);
      }
    }

    if (window.IconComponent) window.IconComponent.initialize();
  })();
</script>

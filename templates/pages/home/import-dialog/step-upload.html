<div class="flex-1 size-full flex flex-col items-center justify-center gap-4 py-5">
  <div class="sapce-y-0.5 text-center max-w-70 text-[var(--text--strong-950)]">
    <h6 class="h6-title">Upload Your Data File</h6>
    <p class="paragraph-small">
      Supported format : CSV, Excel (.xlsx, .xls)
    </p>
  </div>

  <div id="upload-component" class="w-full flex justify-center">
    <!-- Component injected by JS -->
  </div>

  <p class="paragraph-small text-[var(--text--strong-950)]">
    Need a template?
    <a href="#" class="text-[var(--state--information--base)] underline cursor-pointer">
      Download sample template
    </a>
  </p>
</div>

<!-- State 1: No File Selected -->
<template id="template-upload-empty">
  <div
    class="w-full min-h-[12.625rem] max-w-[25rem] border border-dashed border-[var(--stroke--sub-300)] rounded-[0.75rem] p-4 flex flex-col items-center justify-center gap-5 transition-colors"
    id="drop-zone" ondragenter="handleDragEnter(event)" ondragleave="handleDragLeave(event)"
    ondragover="handleDragOver(event)" ondrop="handleDrop(event)">

    <span data-icon="upload-cloud-2-line" data-size="24" data-color="var(--icon--sub-600)"></span>

    <div class="space-y-1.5 text-center">
      <p class="paragraph-small text-[var(--text--strong-950)]">Choose a file or drag & drop it here.</p>
      <p class="paragraph-x-small text-[var(--text--sub-600)]">
        CSV and Excel up to 50 MB.
      </p>
    </div>

    <button class="btn btn-outline h-8 min-h-0 px-3 label-x-small"
      onclick="document.getElementById('file-upload').click()">
      Browse file
    </button>
    <input type="file" id="file-upload" class="hidden" accept=".csv,.xlsx,.xls" onchange="handleFileSelect(event)" />
  </div>
</template>

<!-- State 2: File Uploading / Selected -->
<template id="template-upload-file">
  <div class="w-full max-w-[25rem] border border-[var(--stroke--sub-300)] rounded-[0.75rem] p-4 space-y-4">
    <div class="flex items-start justify-between gap-3">
      <span data-icon="file-csv" data-size="40" id="file-icon-placeholder"></span>

      <div class="space-y-1 flex-1 min-w-0">
        <p class="label-small text-[var(--text--strong-950)] truncate" id="file-name">example.csv</p>

        <p class="paragraph-x-small text-[var(--text--sub-600)] inline-flex items-center gap-1" id="status-container">
          <!-- Content injected via JS -->
          <span id="size-text">0 KB of 0 KB • </span>
          <span class="text-[var(--color-primary)] inline-flex items-center gap-1" id="status-wrapper">
            <span data-icon="loader-2-fill" data-size="16" class="animate-spin"></span>
            <span class="text-[var(--text--strong-950)]">Uploading...</span>
          </span>
        </p>
      </div>

      <button class="btn btn-ghost btn-sm btn-square size-8 min-h-0" onclick="resetUpload()" id="cancel-upload-btn">
        <span data-icon="close-line" data-size="16" data-color="var(--icon--sub-600)"></span>
      </button>
    </div>

    <progress id="upload-progress" class="progress progress-primary w-full" value="0" max="100"></progress>
  </div>
</template>

<script>
  // Simple file upload logic
  (function () {
    const container = document.getElementById('upload-component');
    const emptyTemplate = document.getElementById('template-upload-empty');

    // Initialize with empty state (if not already populated)
    if (container && emptyTemplate && !container.textContent.trim()) {
      container.innerHTML = emptyTemplate.innerHTML;
      if (window.IconComponent) window.IconComponent.initialize();
    }

    // --- Global Helpers (attached to window for event attributes) ---

    window.handleDragEnter = (e) => {
      e.preventDefault();
      const zone = e.currentTarget;
      if (zone) zone.classList.add('bg-[var(--bg--weak-50)]');
    };

    window.handleDragLeave = (e) => {
      e.preventDefault();
      const zone = e.currentTarget;
      if (zone) zone.classList.remove('bg-[var(--bg--weak-50)]');
    };

    window.handleDragOver = (e) => {
      e.preventDefault();
    };

    window.handleDrop = (e) => {
      e.preventDefault();
      const zone = e.currentTarget;
      if (zone) zone.classList.remove('bg-[var(--bg--weak-50)]');

      const files = e.dataTransfer.files;
      if (files.length > 0) processFile(files[0]);
    };

    window.handleFileSelect = (e) => {
      const files = e.target.files;
      if (files.length > 0) processFile(files[0]);
    };

    window.resetUpload = () => {
      const container = document.getElementById('upload-component');
      const emptyTemplate = document.getElementById('template-upload-empty');
      if (container && emptyTemplate) {
        container.innerHTML = emptyTemplate.innerHTML;
        if (window.IconComponent) window.IconComponent.initialize();
      }
    };

    // --- Internal Logic ---

    function processFile(file) {
      const container = document.getElementById('upload-component');
      const fileTemplate = document.getElementById('template-upload-file');

      if (!container || !fileTemplate) return;

      // Render File Template
      container.innerHTML = fileTemplate.innerHTML;

      // Update File Name
      const nameEl = container.querySelector('#file-name');
      if (nameEl) nameEl.textContent = file.name;

      // Update File Icon
      const icon = file.name.endsWith('.csv') ? 'file-csv' : 'file-xlsx';
      const iconEl = container.querySelector('#file-icon-placeholder');
      if (iconEl) iconEl.setAttribute('data-icon', icon);

      // Initial Status State
      const sizeStr = (file.size / 1024).toFixed(1) + ' KB';

      const sizeText = container.querySelector('#size-text');
      if (sizeText) sizeText.textContent = `0 KB of ${sizeStr} • `;

      if (window.IconComponent) window.IconComponent.initialize();

      // Mock Upload Progress
      const progress = container.querySelector('#upload-progress');
      const statusWrapper = container.querySelector('#status-wrapper');
      const cancelBtn = container.querySelector('#cancel-upload-btn');

      let percent = 0;

      const interval = setInterval(() => {
        percent += 5;
        if (progress) progress.value = percent;

        // Update size text dynamically
        if (sizeText) {
          const currentSize = ((file.size * (percent / 100)) / 1024).toFixed(1) + ' KB';
          sizeText.textContent = `${currentSize} of ${sizeStr} • `;
        }

        if (percent >= 100) {
          clearInterval(interval);

          // --- Completion State ---

          // 1. Update Status Text & Icon
          if (statusWrapper) {
            statusWrapper.innerHTML = `
              <span data-icon="select-box-circle-fill" data-size="16" class="text-[var(--state--success--base)]"></span>
              <span class="text-[var(--text--strong-950)]">Completed</span>
            `;
            statusWrapper.className = "inline-flex items-center gap-1";
          }

          // 2. Change Cancel Button to Delete Icon
          if (cancelBtn) {
            cancelBtn.innerHTML = `<span data-icon="delete-bin-5-line" data-size="16" data-color="var(--icon--sub-600)"></span>`;
          }

          // Re-init new icons
          if (window.IconComponent) window.IconComponent.initialize();
        }
      }, 150);
    }
  })();
</script>

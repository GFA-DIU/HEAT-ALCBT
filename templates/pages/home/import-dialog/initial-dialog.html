<dialog id="import_dialog_initial" class="modal">
  <div class="modal-box p-0 max-w-[30rem] h-[95vh] flex flex-col bg-[var(--bg--white-0)]">
    <div class="px-6 flex flex-col items-center gap-1 max-w-[21rem] mx-auto text-center">
      <h2 class="text-xl font-extrabold text-[var(--text--strong-950)] mt-6">
        Create and Assign building.
      </h2>
      <p class="text-sm/4.5 text-[var(--text--sub-600)]">
        Please select a user or an organization to assign building to when
        created
      </p>
    </div>
    <div class="flex items-start w-full gap-6 h-fit mt-4">
      <button id="tab-btn-organizations" type="button"
        class="flex-1 py-3.5 px-4 border-b-2 flex items-center justify-center gap-1.5 label-small cursor-pointer transition-colors"
        onclick="setInitialTab('organizations')">
        <span data-icon="building-3-line"></span>
        Organizations
      </button>
      <button id="tab-btn-users" type="button"
        class="flex-1 py-3.5 px-4 border-b-2 flex items-center justify-center gap-1.5 label-small cursor-pointer transition-colors"
        onclick="setInitialTab('users')">
        <span data-icon="user-6-line"></span>
        Users
      </button>
    </div>
    <div class="w-full px-6 pb-6 flex-1 overflow-y-auto hide-scrollbar">
      <div id="initial-dialog-content"></div>
    </div>
    <div class="flex items-center justify-end gap-2 py-4 px-6 border-t border-[var(--stroke--soft-200)]">
      <button class="btn btn-outline h-9 px-4 label-small" onclick="import_dialog_initial.close()">
        Cancel
      </button>
      <button class="btn btn-primary h-9 px-4 label-small"
        onclick="import_dialog_initial.close(); import_dialog.showModal()">
        Save & Continue
      </button>
    </div>
  </div>
</dialog>

<template id="organization-content">
  <div class="space-y-2.5 w-full mt-4">
    <label class="input w-full">
      <span data-icon="search-2-line" data-size="20" data-color="var(--icon--soft-400)"></span>
      <input type="text" class="grow" placeholder="Search organizations name here" />
    </label>

    <div class="items-center justify-center w-full hidden">
      <!-- Loader placeholder -->
      <span class="loading loading-spinner"></span>
    </div>
    <div class="grid grid-cols-1 gap-2">
      <label for="novaSphere-holdings"
        class="py-4 px-2.5 flex items-center justify-between gap-3 text-[var(--bg--black-0)] rounded-[0.5rem] border border-[var(--bg--weak-50)] w-full cursor-pointer has-[input:checked]:bg-(--bg--weak-50) has-[input:checked]:border-transparent">
        <div class="flex items-center gap-2">
          <div
            class="rounded-full size-5 bg-[var(--neutral--gray--200)] grid place-items-center shrink-0 label-x-small text-[var(--text--strong-950)]">
            N
          </div>
          <span class="label-small">NovaSphere Holdings</span>
        </div>
        <input type="radio" id="novaSphere-holdings" name="organization" value="NovaSphere Holdings"
          class="radio radio-sm checked:bg-primary checked:text-white checked:border-transparent" />
      </label>
    </div>
  </div>
</template>
<template id="users-content">
</template>

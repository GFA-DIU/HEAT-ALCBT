<li class="{% if item.is_newest %}bg-[var(--bg--soft-200)]{% else %}bg-[var(--bg--weak-50)]{% endif %} rounded-lg p-2.5 border border-[var(--stroke--soft-200)] flex justify-between gap-2"
    data-item-type="component"
    data-item-index="{{ index }}">
  <span data-icon="stack-line" data-size="20" data-color="var(--icon--strong-950)"></span>
  <div class="flex-1 flex flex-col gap-2.5">
    <h6 class="text-sm/5 font-bold">{{ item.title }}</h6>
    <div class="flex items-center flex-wrap gap-2">
      <div class="bg-[var(--color-primary)] size-5 rounded-full flex items-center justify-center">
        <span data-icon="leaf-line" data-size="14" data-color="var(--bg--strong-950)"></span>
      </div>
      <div class="text-sm/5 font-medium pl-2 pr-2.5 border-r border-[var(--stroke--soft-200)]">
        {{ item.total_gwp|floatformat:2 }} kgCO₂eq/m²
      </div>
      <span class="badge badge-outline py-1 px-2 border-[var(--stroke--soft-200)] text-[var(--text--sub-600)]">
        {{ item.category_name }}
      </span>
      <p class="text-sm/5 text-[var(--text--sub-600)]">
        {{ item.quantity }} {{ item.dimension }}
      </p>
    </div>
  </div>
  <div class="flex gap-2">
    <button type="button" class="btn size-5 btn-ghost p-0 edit-item-btn" data-item-type="component" data-item-index="{{ index }}">
      <span data-icon="edit-line" data-size="20" data-color="var(--icon--strong-950)"></span>
    </button>
    <button type="button" class="btn size-5 btn-ghost p-0 delete-item-btn" data-item-type="component" data-item-index="{{ index }}">
      <span data-icon="delete-bin-5-line" data-size="20" data-color="var(--icon--strong-950)"></span>
    </button>
  </div>
</li>

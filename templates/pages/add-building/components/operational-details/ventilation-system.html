{% load static %}
<div id="ventilation-system-container" class="w-full">
  <div class="w-full flex flex-col">
    <button class="btn btn-outline w-fit" onclick="openVentilationSystemModal()">
      <span data-icon="add-large-fill" data-size="20" data-color="var(--icon--strong-950)"></span>
      Add ventilation system
    </button>
    <div class="divider before:h-[0.0625rem] after:h-[0.0625rem] before:bg-[var(--stroke--soft-200)] after:bg-[var(--stroke--soft-200)]"></div>
    <ul id="ventilation-systems-list" class="grid grid-cols-1 gap-2"></ul>
  </div>
</div>

<dialog id="ventilation_system_modal" class="modal modal-bottom sm:modal-end">
  <div class="modal-box p-0 !h-[97vh] my-auto mr-3.5 !w-full !max-w-[40.375rem] rounded-[1.25rem] overflow-y-auto flex flex-col justify-between">
    <div class="flex justify-between p-5 w-full">
      <div class="flex flex-col">
        <h3 class="text-lg/6 font-medium">Add a ventilation system</h3>
        <p class="text-sm/5 text-[var(--text--sub-600)]">Enter details of the building's ventilation system, including type and capacity</p>
      </div>
      <button type="button" onclick="closeVentilationSystemModal()" class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">
        <span data-icon="close-line" data-size="16" data-color="var(--icon--sub-600)"></span>
      </button>
    </div>
    <form id="ventilation-system-form" class="flex-1 overflow-y-auto hide-scrollbar">
      {% csrf_token %}
      <div class="px-5 py-4">
        <fieldset class="fieldset">
          <legend class="fieldset-legend">Type of ventilation system<span class="text-[var(--state--error--base)]">*</span></legend>
          <select class="select w-full" id="ventilation-type-select" name="ventilation_type"
            hx-get="/select_lists/?ventilation_types=1"
            hx-trigger="load"
            hx-target="this"
            hx-swap="innerHTML"
            onchange="handleVentilationTypeChange(this.value)"
            required>
            <option value="">Select a ventilation system</option>
          </select>
        </fieldset>
      </div>
      <div id="selected-ventilation-system"></div>
    </form>
    <div class="p-5 border-t border-[var(--stroke--soft-200)] flex gap-4 items-center justify-between w-full">
      <button type="button" class="btn flex-1 btn-sm btn-outline text-[var(--text--sub-600)] border-[var(--stroke--soft-200)]" onclick="closeVentilationSystemModal()">Cancel</button>
      <button type="button" class="btn flex-1 btn-sm btn-primary" onclick="saveVentilationSystem()">Save</button>
    </div>
  </div>
</dialog>

<dialog id="ventilation_system_modal_delete" class="modal modal-middle">
  <div class="modal-box w-full max-w-[26.375rem] p-0">
    <div class="flex flex-col items-center p-5">
      <div class="flex items-center p-2 justify-center rounded-[var(--radius-8)] bg-[var(--state--warning--lighter)]">
        <span data-icon="alert-fill" data-size="24" data-color="var(--state--warning--base)"></span>
      </div>
      <h3 class="text-lg/6 font-medium mt-4">Are you sure?</h3>
      <p class="text-sm/5 text-[var(--text--sub-600)] text-center mt-1">You are about to permanently remove this ventilation system.</p>
    </div>
    <div class="p-5 border-t border-[var(--stroke--soft-200)] flex gap-4 items-center justify-between w-full">
      <button class="btn btn-sm btn-outline text-[var(--text--sub-600)] border-[var(--stroke--soft-200)] flex-1" onclick="ventilation_system_modal_delete.close()">Cancel</button>
      <button class="btn btn-sm btn-error flex-1" onclick="deleteVentilationSystem()">Remove</button>
    </div>
  </div>
</dialog>

<template id="no-ventilation-system-template">
  <div class="w-full flex flex-col gap-3 items-center justify-center">
    <img src="{% static 'assets/ventilation-system.png' %}" alt="Ventilation System" />
    <p class="text-sm/5 font-medium">Click button below to add a ventilation system</p>
    <button class="btn btn-primary" onclick="ventilation_system_modal.showModal()">Add ventilation system</button>
  </div>
</template>

<template id="ahu-template">
  <div class="px-5 py-1.5 text-[var(--text--soft-400)] bg-[var(--bg--weak-50)] text-xs/4">AIR HANDLING UNIT (AHU) DATA</div>
  <div class="px-5 py-4 grid grid-cols-2 gap-x-2.5 gap-y-1">

    <fieldset class="fieldset">
      <legend class="fieldset-legend">Total number of units installed<span class="text-[var(--state--error--base)]">*</span></legend>
      <label class="input validator w-full">
        <input type="number" name="number_of_units" placeholder="e.g. 3" required min="1" oninput="recalcVentPowerAndEnergy(this.closest('form'),'ahu')" />
      </label>
      <p class="validator-hint">Must be at least 1</p>
    </fieldset>

    <fieldset class="fieldset">
      <legend class="fieldset-legend">Baseline efficiency<span class="text-[var(--state--error--base)]">*</span></legend>
      <label class="input validator w-full">
        <input type="number" name="baseline_efficiency" placeholder="0.30 – 1.20" required min="0.01" max="10" step="0.01" oninput="recalcVentPowerAndEnergy(this.closest('form'),'ahu')" />
        <span class="text-sm/5 align-middle text-[var(--text--sub-600)]">W/CMH</span>
      </label>
      <p class="validator-hint">Typical: 0.30 – 1.20 W/CMH</p>
    </fieldset>

    <fieldset class="fieldset">
      <legend class="fieldset-legend">Installation of Variable Speed Drives (VSD)<span class="text-[var(--state--error--base)]">*</span></legend>
      <div class="flex items-center gap-2.5 mt-1">
        <label class="flex items-center gap-2"><input type="radio" name="variable_speed_drives" value="yes" class="radio radio-xs" onchange="recalcVentPowerAndEnergy(this.closest('form'),'ahu')" /> Yes</label>
        <label class="flex items-center gap-2"><input type="radio" name="variable_speed_drives" value="no" class="radio radio-xs" checked onchange="recalcVentPowerAndEnergy(this.closest('form'),'ahu')" /> No</label>
      </div>
    </fieldset>

    <fieldset class="fieldset">
      <legend class="fieldset-legend">Installation of Demand Controlled Ventilation (DCV)<span class="text-[var(--state--error--base)]">*</span></legend>
      <div class="flex items-center gap-2.5 mt-1">
        <label class="flex items-center gap-2"><input type="radio" name="demand_controlled_ventilation" value="yes" class="radio radio-xs" onchange="recalcVentPowerAndEnergy(this.closest('form'),'ahu')" /> Yes</label>
        <label class="flex items-center gap-2"><input type="radio" name="demand_controlled_ventilation" value="no" class="radio radio-xs" checked onchange="recalcVentPowerAndEnergy(this.closest('form'),'ahu')" /> No</label>
      </div>
    </fieldset>

    <fieldset class="fieldset col-span-2">
      <legend class="fieldset-legend">Annual operating schedule<span class="text-[var(--state--error--base)]">*</span>
        <span data-icon="info-custom-fill" data-size="20" data-color="var(--icon--disabled-300)"></span>
      </legend>
      <div class="w-full flex gap-1.5 items-center">
        <div class="flex-1"><label class="input validator w-full">
          <input type="number" name="operating_hours_per_day" id="ahu-hours" placeholder="e.g. 10" required min="1" max="24" oninput="recalcVentPowerAndEnergy(this.closest('form'),'ahu')" />
          <span class="text-sm/5 align-middle text-[var(--text--sub-600)]">Hours / day</span>
        </label></div>
        <div class="flex-1"><label class="input validator w-full">
          <input type="number" name="operating_days_per_week" id="ahu-days" placeholder="e.g. 5" required min="1" max="7" oninput="recalcVentPowerAndEnergy(this.closest('form'),'ahu')" />
          <span class="text-sm/5 align-middle text-[var(--text--sub-600)]">days / week</span>
        </label></div>
        <div class="flex-1"><label class="input validator w-full">
          <input type="number" name="operating_weeks_per_year" id="ahu-weeks" placeholder="e.g. 52" required min="1" max="52" oninput="recalcVentPowerAndEnergy(this.closest('form'),'ahu')" />
          <span class="text-sm/5 align-middle text-[var(--text--sub-600)]">weeks / year</span>
        </label></div>
      </div>
    </fieldset>

    <fieldset class="fieldset col-span-2">
      <legend class="fieldset-legend">Total ventilation system power input</legend>
      <label class="input w-full bg-[var(--bg--weak-50)]">
        <input type="number" name="power_input" placeholder="Auto-calculated" min="0" step="0.01" readonly class="cursor-not-allowed" />
        <span class="text-sm/5 align-middle text-[var(--text--sub-600)]">kW</span>
      </label>
      <p class="label-text-alt text-[var(--text--soft-400)]">Airflow (CMH) × Baseline efficiency (W/CMH) × Units ÷ 1000</p>
    </fieldset>

    <div class="col-span-2 mt-3">
      <div class="collapse rounded-none">
        <input type="checkbox" class="peer" />
        <div class="group collapse-title p-2.5 bg-[var(--bg--weak-50)] text-[0.813rem]/5 font-semibold flex items-center justify-between rounded-[var(--radius-4)]">
          OTHER DETAILS<span data-icon="caret-down" data-size="16" data-color="var(--icon--soft-400)" class="transition-transform duration-300 ease-in-out group-[peer:checked]:rotate-180"></span>
        </div>
        <div class="collapse-content mt-4 px-0">
          <div class="grid grid-cols-2 gap-2">
            <fieldset class="fieldset"><legend class="fieldset-legend">Air flow rate <span class="text-[var(--text--sub-600)]">(Optional)</span></legend>
              <label class="input w-full pr-0 overflow-hidden">
                <input type="number" name="airflow_rate" placeholder="e.g. 5000" min="0" oninput="recalcVentPowerAndEnergy(this.closest('form'),'ahu')" />
                <select class="select select-ghost focus:!outline-none !pr-0 rounded-none w-25" name="ventilation_capacity">
                  <option value="M3H" selected>CMH</option><option value="F3M">CFM</option>
                </select>
              </label>
            </fieldset>
            <fieldset class="fieldset col-span-2"><legend class="fieldset-legend">Total energy consumption annually <span class="text-[var(--text--sub-600)]">(Auto-calculated)</span></legend>
              <label class="input w-full bg-[var(--bg--weak-50)]"><input type="number" name="annual_energy_consumption" placeholder="Auto-calculated" min="0" readonly class="cursor-not-allowed" /><span class="text-sm/5 align-middle text-[var(--text--sub-600)]">kWh/year</span></label>
              <p class="label-text-alt text-[var(--text--soft-400)]">Power (kW) × hrs/day × days/wk × wks/yr × VSD factor × DCV factor</p>
            </fieldset>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>

              <select class="select w-full" name="number_of_stars">
                <option disabled selected value="">Select</option>
                <option value="1">1</option><option value="2">2</option><option value="3">3</option>
                <option value="4">4</option><option value="5">5</option>
              </select>
            </fieldset>
            <fieldset class="fieldset col-span-2"><legend class="fieldset-legend">Total energy consumption annually <span class="text-[var(--text--sub-600)]">(Auto-calculated)</span></legend>
              <label class="input w-full bg-[var(--bg--weak-50)]"><input type="number" name="annual_energy_consumption" placeholder="Auto-calculated" min="0" readonly class="cursor-not-allowed" /><span class="text-sm/5 align-middle text-[var(--text--sub-600)]">kWh/year</span></label>
              <p class="label-text-alt text-[var(--text--soft-400)]">Power (kW) × hrs/day × days/wk × wks/yr</p>

<script>
  // ================================================================
  // Auto-calculation helpers for ventilation systems
  // ================================================================

  // AHU / DOAS: power_input = airflow × baseline_efficiency × units ÷ 1000
  //             annual_energy = power_input × h × d × w × VSD_factor × DCV_factor
  window.recalcVentPowerAndEnergy = function(form, ventType) {
    if (!form) return;
    var airflowEl   = form.querySelector('[name="airflow_rate"]');
    var effEl       = form.querySelector('[name="baseline_efficiency"]');
    var unitsEl     = form.querySelector('[name="number_of_units"]');
    var powerEl     = form.querySelector('[name="power_input"]');
    var energyEl    = form.querySelector('[name="annual_energy_consumption"]');

    var airflow  = airflowEl  ? parseFloat(airflowEl.value)  : NaN;
    var eff      = effEl      ? parseFloat(effEl.value)      : NaN;
    var units    = unitsEl    ? parseFloat(unitsEl.value)    : NaN;

    // Recalculate power_input from airflow when all three inputs are present
    if (!isNaN(airflow) && !isNaN(eff) && !isNaN(units) && airflow > 0 && units > 0) {
      if (powerEl) powerEl.value = ((airflow * eff * units) / 1000).toFixed(2);
    }

    // Recalculate annual energy
    if (!energyEl || !powerEl) return;
    var power = parseFloat(powerEl.value);
    var hrsEl   = form.querySelector('[name="operating_hours_per_day"]');
    var daysEl  = form.querySelector('[name="operating_days_per_week"]');
    var weeksEl = form.querySelector('[name="operating_weeks_per_year"]');
    var hrs   = hrsEl   ? parseFloat(hrsEl.value)   : NaN;
    var days  = daysEl  ? parseFloat(daysEl.value)  : NaN;
    var weeks = weeksEl ? parseFloat(weeksEl.value) : NaN;

    if (isNaN(power) || isNaN(hrs) || isNaN(days) || isNaN(weeks)) {
      energyEl.value = '';
      return;
    }

    // VSD factor (AHU/DOAS only)
    var vsdEl = form.querySelector('[name="variable_speed_drives"]:checked');
    var dcvEl = form.querySelector('[name="demand_controlled_ventilation"]:checked');
    var vsdFactor = (vsdEl && vsdEl.value === 'yes') ? 0.80 : 1.00;
    var dcvFactor = (dcvEl && dcvEl.value === 'yes') ? 0.70 : 1.00;

    energyEl.value = (power * hrs * days * weeks * vsdFactor * dcvFactor).toFixed(3);
  };

  // FCU / Cassette / Fan: annual_energy = power_input × h × d × w
  window.recalcVentSimpleEnergy = function(form) {
    if (!form) return;
    var powerEl  = form.querySelector('[name="power_input"]');
    var energyEl = form.querySelector('[name="annual_energy_consumption"]');
    if (!powerEl || !energyEl) return;

    var power = parseFloat(powerEl.value);
    var hrsEl   = form.querySelector('[name="operating_hours_per_day"]');
    var daysEl  = form.querySelector('[name="operating_days_per_week"]');
    var weeksEl = form.querySelector('[name="operating_weeks_per_year"]');
    var hrs   = hrsEl   ? parseFloat(hrsEl.value)   : NaN;
    var days  = daysEl  ? parseFloat(daysEl.value)  : NaN;
    var weeks = weeksEl ? parseFloat(weeksEl.value) : NaN;

    if (isNaN(power) || isNaN(hrs) || isNaN(days) || isNaN(weeks)) {
      energyEl.value = '';
      return;
    }
    energyEl.value = (power * hrs * days * weeks).toFixed(3);
  };

  var VENT_CLIMATE_ZONE = "{{ climate_zone }}";

  if (!window.editingVentilationSystemId) window.editingVentilationSystemId = null;

  var VENT_TYPE_MAP = {
    'AHU':        'ahu-template',
    'FCU':        'fcu-template',
    'DOAS':       'doas-template',
    'CASSETTE_AC':'cassette-template',
    'FAN':        'fan-template',
  };

  // Annual hours → [h/day, d/week, w/year]
  // AHU/FCU/DOAS/Cassette use 5d/52wk; Fans use 7d/52wk
  var VENT_OPERATING_DEFAULTS = {
    // total hrs/year ÷ (d/w × 52): AHU/FCU/DOAS/CASSETTE=5d/w, FAN=7d/w
    'AHU': {
      'hot-dry':     [14, 5, 52], 'warm-humid':  [17, 5, 52], 'composite':   [10, 5, 52],
      'temperate':   [9,  5, 52], 'cold':        [7,  5, 52], 'tropical-wet':[19, 5, 52],
    },
    'FCU': {
      'hot-dry':     [12, 5, 52], 'warm-humid':  [17, 5, 52], 'composite':   [9,  5, 52],
      'temperate':   [7,  5, 52], 'cold':        [5,  5, 52], 'tropical-wet':[20, 5, 52],
    },
    'DOAS': {
      'hot-dry':     [14, 5, 52], 'warm-humid':  [14, 5, 52], 'composite':   [13, 5, 52],
      'temperate':   [9,  5, 52], 'cold':        [7,  5, 52], 'tropical-wet':[17, 5, 52],
    },
    'CASSETTE_AC': {
      'hot-dry':     [14, 5, 52], 'warm-humid':  [13, 5, 52], 'composite':   [10, 5, 52],
      'temperate':   [7,  5, 52], 'cold':        [5,  5, 52], 'tropical-wet':[16, 5, 52],
    },
    'FAN': {
      'hot-dry':     [15, 7, 52], 'warm-humid':  [18, 7, 52], 'composite':   [12, 7, 52],
      'temperate':   [9,  7, 52], 'cold':        [7,  7, 52], 'tropical-wet':[20, 7, 52],
    },
  };

  function applyVentOperatingDefaults(form, ventType) {
    if (!VENT_CLIMATE_ZONE) return;
    const defaults = (VENT_OPERATING_DEFAULTS[ventType] || {})[VENT_CLIMATE_ZONE];
    if (!defaults) return;
    const [h, d, w] = defaults;
    const hEl = form.querySelector('[name="operating_hours_per_day"]');
    const dEl = form.querySelector('[name="operating_days_per_week"]');
    const wEl = form.querySelector('[name="operating_weeks_per_year"]');
    if (hEl && !hEl.value) hEl.value = h;
    if (dEl && !dEl.value) dEl.value = d;
    if (wEl && !wEl.value) wEl.value = w;
  }

  function getCSRFToken() {
    return document.querySelector('[name=csrfmiddlewaretoken]').value;
  }

  function getBuildingId() {
    return new URLSearchParams(window.location.search).get('building_uuid');
  }

  window.openVentilationSystemModal = function() {
    window.editingVentilationSystemId = null;
    document.getElementById('ventilation-system-form').reset();
    document.getElementById('selected-ventilation-system').innerHTML = '';
    ventilation_system_modal.showModal();
  };

  window.closeVentilationSystemModal = function() {
    ventilation_system_modal.close();
    window.editingVentilationSystemId = null;
  };

  function loadVentTemplate(ventType) {
    const templateId = VENT_TYPE_MAP[ventType];
    if (!templateId) return;
    const tmpl = document.getElementById(templateId);
    const container = document.getElementById('selected-ventilation-system');
    if (tmpl) {
      container.innerHTML = tmpl.innerHTML;
      if (typeof htmx !== 'undefined') htmx.process(container);
    }
    setTimeout(() => {
      applyVentOperatingDefaults(document.getElementById('ventilation-system-form'), ventType);
    }, 50);
  }

  window.handleVentilationTypeChange = function(ventType) {
    if (!ventType) {
      document.getElementById('selected-ventilation-system').innerHTML = '';
      return;
    }
    loadVentTemplate(ventType);
  };

  window.saveVentilationSystem = async function() {
    const form = document.getElementById('ventilation-system-form');
    const formData = new FormData(form);
    const buildingId = getBuildingId();
    if (!buildingId) { Toast.error('Building ID not found'); return; }

    const validator = new window.FormValidator(form);
    if (!validator.validate()) { console.error('Validation failed', validator.errors); return; }

    const ventType = document.getElementById('ventilation-type-select').value;
    if (!ventType) { Toast.error('Please select a ventilation system type'); return; }

    const systemData = { building_uuid: buildingId, ventilation_type: ventType };
    if (window.editingVentilationSystemId) systemData.ventilation_system_id = window.editingVentilationSystemId;

    for (const [key, value] of formData.entries()) {
      if (key !== 'csrfmiddlewaretoken' && key !== 'ventilation_type') {
        systemData[key] = value;
      }
    }

    try {
      const method = window.editingVentilationSystemId ? 'PUT' : 'POST';
      const response = await fetch('/ventilation-system/', {
        method,
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCSRFToken() },
        body: JSON.stringify(systemData),
      });
      const result = await response.json();
      if (result.success) {
        await window.renderVentilationSystems();
        window.closeVentilationSystemModal();
      } else {
        Toast.error('Error saving ventilation system: ' + JSON.stringify(result.errors));
      }
    } catch (e) {
      console.error(e);
      Toast.error('An error occurred while saving the ventilation system');
    }
  };

  window.renderVentilationSystems = async function() {
    const buildingId = getBuildingId();
    if (!buildingId) return;
    const list = document.getElementById('ventilation-systems-list');
    try {
      const resp = await fetch(`/ventilation-system/${buildingId}/`, { headers: { 'Content-Type': 'application/json' } });
      const result = await resp.json();
      if (result.success && result.ventilation_systems) {
        const systems = result.ventilation_systems;
        if (!systems.length) {
          list.innerHTML = document.getElementById('no-ventilation-system-template').innerHTML;
          return;
        }
        list.innerHTML = systems.map(system => {
          const airflow = system.air_flow_rate ? `${system.air_flow_rate} ${system.ventilation_capacity_display || ''}` : 'N/A';
          return `
            <li class="flex items-center justify-between gap-1.5 w-full p-2.5 rounded-[var(--radius-8)] bg-[var(--bg--weak-50)] border border-[var(--stroke--soft-200)]">
              <span data-icon="windy-fill" data-size="20" data-color="var(--icon--strong-950)" class="shrink-0 self-start"></span>
              <div class="flex flex-col flex-1">
                <p class="text-sm/5 font-medium">${system.ventilation_type_display}</p>
                <p class="text-sm/5 text-[var(--text--sub-600)]">
                  <span class="border-r border-[var(--text--sub-600)] pr-1">Units: ${system.number_of_units_installed}</span>
                  <span class="pl-1">Airflow: ${airflow}</span>
                </p>
              </div>
              <div class="flex items-center gap-3">
                <button class="btn size-5 btn-ghost p-0" onclick="editVentilationSystem(${system.id})">
                  <span data-icon="edit-line" data-size="16" data-color="var(--icon--strong-950)"></span>
                </button>
                <button class="btn size-5 btn-ghost p-0" onclick="confirmDeleteVentilationSystem(${system.id})">
                  <span data-icon="delete-bin-5-line" data-size="16" data-color="var(--icon--strong-950)"></span>
                </button>
              </div>
            </li>`;
        }).join('');
        if (typeof window.initIcons === 'function') window.initIcons();
      } else {
        list.innerHTML = document.getElementById('no-ventilation-system-template').innerHTML;
      }
    } catch (e) {
      console.error(e);
      list.innerHTML = document.getElementById('no-ventilation-system-template').innerHTML;
    }
  };

  window.editVentilationSystem = async function(systemId) {
    const buildingId = getBuildingId();
    if (!buildingId) return;
    try {
      const resp = await fetch(`/ventilation-system/${buildingId}/`, { headers: { 'Content-Type': 'application/json' } });
      const result = await resp.json();
      if (!result.success) return;
      const system = result.ventilation_systems.find(s => s.id === systemId);
      if (!system) return;

      window.editingVentilationSystemId = systemId;
      document.getElementById('ventilation-system-form').reset();
      document.getElementById('selected-ventilation-system').innerHTML = '';

      const typeSelect = document.getElementById('ventilation-type-select');
      typeSelect.value = system.ventilation_type;
      loadVentTemplate(system.ventilation_type);

      setTimeout(() => {
        const form = document.getElementById('ventilation-system-form');
        const sf = (name, val) => { if (val === null || val === undefined) return; const el = form.querySelector(`[name="${name}"]`); if (el) el.value = val; };
        const sr = (name, val) => { const el = form.querySelector(`[name="${name}"][value="${val}"]`); if (el) el.checked = true; };

        sf('number_of_units', system.number_of_units_installed);
        sf('baseline_efficiency', system.baseline_efficiency_w_cmh);
        sf('operating_hours_per_day', system.operation_hours_per_workday);
        sf('operating_days_per_week', system.workdays_per_week);
        sf('operating_weeks_per_year', system.workweeks_per_year);
        sf('power_input', system.total_power_input_kw);
        sf('airflow_rate', system.air_flow_rate);
        sf('ventilation_capacity', system.ventilation_capacity);
        sf('annual_energy_consumption', system.total_energy_consumption_kwh_per_year);
        sf('fresh_air_ratio', system.fresh_air_ratio_percent);
        sf('number_of_stars', system.number_of_stars);
        sr('variable_speed_drives', system.variable_speed_drives ? 'yes' : 'no');
        sr('demand_controlled_ventilation', system.demand_controlled_ventilation ? 'yes' : 'no');

        // Recompute auto-calculated fields with loaded values
        if (system.ventilation_type === 'AHU' || system.ventilation_type === 'DOAS') {
          recalcVentPowerAndEnergy(form, system.ventilation_type.toLowerCase());
        } else {
          recalcVentSimpleEnergy(form);
        }
      }, 200);

      ventilation_system_modal.showModal();
    } catch (e) {
      console.error(e);
      Toast.error('An error occurred while loading the ventilation system');
    }
  };

  if (!window.deleteVentilationSystemId) window.deleteVentilationSystemId = null;

  window.confirmDeleteVentilationSystem = function(systemId) {
    window.deleteVentilationSystemId = systemId;
    ventilation_system_modal_delete.showModal();
  };

  window.deleteVentilationSystem = async function() {
    if (window.deleteVentilationSystemId === null) return;
    try {
      const resp = await fetch(`/ventilation-system/${window.deleteVentilationSystemId}/delete/`, {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCSRFToken() },
      });
      const result = await resp.json();
      if (result.success) {
        await window.renderVentilationSystems();
        window.deleteVentilationSystemId = null;
        ventilation_system_modal_delete.close();
      } else {
        Toast.error('Error: ' + JSON.stringify(result.errors));
      }
    } catch (e) {
      console.error(e);
      Toast.error('An error occurred while deleting the ventilation system');
    }
  };

  document.addEventListener('DOMContentLoaded', () => {
    if (document.getElementById('ventilation-systems-list')) window.renderVentilationSystems();
  });
  document.addEventListener('htmx:afterSwap', evt => {
    if (evt.detail.target.id === 'dynamic-content') window.renderVentilationSystems();
  });

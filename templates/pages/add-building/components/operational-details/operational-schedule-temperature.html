<form id="form" class="grid grid-cols-3 gap-1">
    {% csrf_token %}
  <fieldset class="fieldset col-span-3">
    <legend class="fieldset-legend">
      Number of residents (occupants)<span class="text-error">*</span>
    </legend>
    <label class="input validator w-full">
      <input type="number" placeholder="e.g. 10" name="number_of_residents" required min="1" />
    </label>
    <p class="validator-hint">Enter a valid value </p>
  </fieldset>

  <fieldset class="fieldset col-span-3">
    <legend class="fieldset-legend">
      Annual operating schedule<span class="text-error">*</span
      ><span
        data-icon="info-custom-fill"
        data-size="20"
        data-color="var(--icon--disabled-300)"
      ></span>
    </legend>
    <div class="w-full flex gap-1.5 items-center">
      <div class="flex-1">
        <label class="input validator w-full">
          <input type="number" placeholder="e.g. 1" name="annual_operating_hours_per_day" required min="1" max="24" />
          <span class="text-sm/5 align-middle text-[var(--text--sub-600)]"
            >Hours / day</span
          >
        </label>
        <p class="validator-hint">Enter a valid value</p>
      </div>
      <div class="flex-1">
        <label class="input validator w-full">
          <input type="number" placeholder="e.g. 1" name="annual_operating_days_per_week" required min="1" max="7" />
          <span class="text-sm/5 align-middle text-[var(--text--sub-600)]"
            >days / week</span
          >
        </label>
        <p class="validator-hint">Enter a valid value</p>
      </div>
      <div class="flex-1">
        <label class="input validator w-full">
          <input type="number" placeholder="e.g. 1" name="annual_operating_weeks_per_year" required min="1" max="52" />
          <span class="text-sm/5 align-middle text-[var(--text--sub-600)]"
            >weeks / year</span
          >
        </label>
        <p class="validator-hint">Enter a valid value</p>
      </div>
    </div>
  </fieldset>

  <div class="col-span-3 grid grid-cols-2 gap-1">
    <fieldset class="fieldset">
      <legend class="fieldset-legend">
        Room heating temperature<span class="text-error">*</span>
      </legend>
      <label class="input validator w-full pr-0 overflow-hidden">
        <input type="number" placeholder="e.g. 18" name="room_heating_temperature" required  />
        <select
          class="select select-ghost focus:!outline-none !pr-0 rounded-none w-[calc(max-content+1rem)]"
          name="heating_temperature_unit"
        >
          <option value="celsius" selected>°Celsius</option>
          <option value="fahrenheit">°Fahrenheit</option>
        </select>
      </label>
      <p class="validator-hint">Enter a valid value </p>
    </fieldset>

    <fieldset class="fieldset">
      <legend class="fieldset-legend">
        Room cooling temperature<span class="text-error">*</span>
      </legend>
      <label class="input validator w-full pr-0 overflow-hidden">
        <input type="number" placeholder="e.g. 32" name="room_cooling_temperature" required />
        <select
          class="select select-ghost focus:!outline-none !pr-0 rounded-none w-[calc(max-content+1rem)]"
          name="cooling_temperature_unit"
        >
          <option value="celsius" selected>°Celsius</option>
          <option value="fahrenheit">°Fahrenheit</option>
        </select>
      </label>
      <p class="validator-hint">Enter a valid value </p>
    </fieldset>
  </div>

</form>

<script>
(function() {
  const form = document.getElementById('form');
  const buildingUuid = new URLSearchParams(window.location.search).get('building_uuid');

  // Load existing data on page load
  async function loadExistingData() {
    if (!buildingUuid) {
      console.warn('[OperationalSchedule] No building UUID found');
      return;
    }

    try {
      const response = await fetch(`{% url 'building_step_operational_schedule' %}?building_uuid=${buildingUuid}`);
      if (!response.ok) {
        console.error('[OperationalSchedule] Failed to load data');
        return;
      }

      const result = await response.json();
      console.log('[OperationalSchedule] Loaded data:', result);

      if (result.success && result.data) {
        const data = result.data;

        // Populate form fields
        if (data.number_of_residents) {
          form.querySelector('[name="number_of_residents"]').value = data.number_of_residents;
        }
        if (data.annual_operating_hours_per_day) {
          form.querySelector('[name="annual_operating_hours_per_day"]').value = data.annual_operating_hours_per_day;
        }
        if (data.annual_operating_days_per_week) {
          form.querySelector('[name="annual_operating_days_per_week"]').value = data.annual_operating_days_per_week;
        }
        if (data.annual_operating_weeks_per_year) {
          form.querySelector('[name="annual_operating_weeks_per_year"]').value = data.annual_operating_weeks_per_year;
        }
        if (data.room_heating_temperature) {
          form.querySelector('[name="room_heating_temperature"]').value = data.room_heating_temperature;
        }
        if (data.heating_temperature_unit) {
          form.querySelector('[name="heating_temperature_unit"]').value = data.heating_temperature_unit;
        }
        if (data.room_cooling_temperature) {
          form.querySelector('[name="room_cooling_temperature"]').value = data.room_cooling_temperature;
        }
        if (data.cooling_temperature_unit) {
          form.querySelector('[name="cooling_temperature_unit"]').value = data.cooling_temperature_unit;
        }

        console.log('[OperationalSchedule] Data loaded successfully');
      }
    } catch (error) {
      console.error('[OperationalSchedule] Error loading data:', error);
    }
  }

  // Load existing data when page loads
  loadExistingData();
})();
</script>

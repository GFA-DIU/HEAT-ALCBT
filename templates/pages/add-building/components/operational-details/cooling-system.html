{% load static %}
<div id="cooling-system-container" class="w-full">
  <div class="w-full flex flex-col">
    <button
      class="btn btn-outline w-fit"
      onclick="openCoolingSystemModal()"
    >
      <span
        data-icon="add-large-fill"
        data-size="20"
        data-color="var(--icon--strong-950)"
      ></span>
      Add a cooling system
    </button>
    <div
      class="divider before:h-[0.0625rem] after:h-[0.0625rem] before:bg-[var(--stroke--soft-200)] after:bg-[var(--stroke--soft-200)]"
    ></div>
    <ul class="grid grid-cols-1 gap-2" id="cooling-systems-list">
      <!-- Cooling systems will be added here dynamically -->
    </ul>
  </div>
</div>

<dialog id="cooling_system_modal" class="modal modal-bottom sm:modal-end">
  <div
    class="modal-box p-0 !h-[97vh] my-auto mr-3.5 !w-full !max-w-[40.375rem] rounded-[1.25rem] overflow-y-auto flex flex-col justify-between"
  >
    <div class="flex justify-between p-5 w-full">
      <div class="flex flex-col">
        <h3 class="text-lg/6 font-medium">Add a cooling system</h3>
        <p class="text-sm/5 text-[var(--text--sub-600)]">
          Enter details of the building’s cooling system, including type and
          capacity
        </p>
      </div>
      <button
        type="button"
        onclick="cooling_system_modal.close()"
        class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2"
      >
        <span
          data-icon="close-line"
          data-size="16"
          data-color="var(--icon--sub-600)"
        ></span>
      </button>
    </div>
    <form id="cooling-system-form" class="flex-1 overflow-y-auto hide-scrollbar">
        {% csrf_token %}
      <div class="px-5 py-4">
        <fieldset class="fieldset">
          <legend class="fieldset-legend">Type of cooling system</legend>
          <select
            class="select w-full"
            id="cooling-system-type"
            name="cooling_system_type"
            hx-get="/select_lists/?cooling_types=1"
            hx-trigger="load"
            hx-target="this"
            hx-swap="innerHTML"
            onchange="handleCoolingSystemTypeChange(this.value)"
          >
            <option value="">Select a cooling system</option>
          </select>
        </fieldset>
      </div>

      <div id="selected-cooling-system"></div>
    </form>
    <div
      class="p-5 border-t border-[var(--stroke--soft-200)] flex gap-4 items-center justify-between w-full"
    >
      <button
        type="button"
        class="btn flex-1 btn-sm btn-outline text-[var(--text--sub-600)] border-[var(--stroke--soft-200)]"
        onclick="closeCoolingSystemModal()"
      >
        Cancel
      </button>
      <button 
        type="button" 
        class="btn flex-1 btn-sm btn-primary"
        onclick="saveCoolingSystem()"
      >
        Save
      </button>
    </div>
  </div>
</dialog>

<dialog id="cooling_system_modal_delete" class="modal modal-middle">
  <div class="modal-box w-full max-w-[26.375rem] p-0">
    <div class="flex flex-col items-center p-5">
      <div
        class="flex items-center p-2 justify-center rounded-[var(--radius-8)] bg-[var(--state--warning--lighter)]"
      >
        <span
          data-icon="alert-fill"
          data-size="24"
          data-color="var(--state--warning--base)"
        ></span>
      </div>
      <h3 class="text-lg/6 font-medium mt-4">Are you sure?</h3>
      <p class="text-sm/5 text-[var(--text--sub-600)] text-center mt-1">
        You are about to remove or delete added cooling system. This will action
        will permanently remove it.
      </p>
    </div>
    <div
      class="p-5 border-t border-[var(--stroke--soft-200)] flex gap-4 items-center justify-between w-full"
    >
      <button
        class="btn btn-sm btn-outline text-[var(--text--sub-600)] border-[var(--stroke--soft-200)] flex-1"
        onclick="cooling_system_modal_delete.close()"
      >
        Cancel
      </button>
      <button class="btn btn-sm btn-error flex-1" onclick="deleteCoolingSystem()">Remove</button>
    </div>
  </div>
</dialog>

<template id="cooling-system-template">
  <div class="w-full flex flex-col">
    <button
      class="btn btn-outline w-fit"
      onclick="cooling_system_modal.showModal()"
    >
      <span
        data-icon="add-large-fill"
        data-size="20"
        data-color="var(--icon--strong-950)"
      ></span>
      Add a cooling system
    </button>
    <div
      class="divider before:h-[0.0625rem] after:h-[0.0625rem] before:bg-[var(--stroke--soft-200)] after:bg-[var(--stroke--soft-200)]"
    ></div>
    <ul class="grid grid-cols-1">
      <li
        class="flex items-center justify-between gap-1.5 w-full p-2.5 rounded-[var(--radius-8)] bg-[var(--bg--weak-50)] border border-[var(--stroke--soft-200)]"
      >
        <span
          data-icon="snowflake-fill"
          data-size="20"
          data-color="var(--icon--strong-950)"
          class="shrink-0 self-start"
        ></span>
        <div class="flex flex-col flex-1">
          <p class="text-sm/5 font-medium">
            Chiller system - Water cooled chiller
          </p>
          <p class="text-sm/5 text-[var(--text--sub-600)] gap-0">
            <span class="border-r border-[var(--text--sub-600)] pr-1"
              >Type: R-290 Propane</span
            >
            <span>Refrigerant quantity: 23 kg</span>
          </p>
        </div>
        <div class="flex items-center gap-3">
          <button class="btn size-5 btn-ghost p-0">
            <span
              data-icon="edit-line"
              data-size="16"
              data-color="var(--icon--strong-950)"
            ></span>
          </button>
          <button
            class="btn size-5 btn-ghost p-0"
            onclick="cooling_system_modal_delete.showModal()"
          >
            <span
              data-icon="delete-bin-5-line"
              data-size="16"
              data-color="var(--icon--strong-950)"
            ></span>
          </button>
        </div>
      </li>
    </ul>
  </div>
</template>

<template id="no-cooling-system-template">
  <div class="w-full flex flex-col gap-3 items-center justify-center">
    <img src="{% static 'assets/cooling-system.png' %}" alt="Cooling System Image" />
    <p class="text-sm/5 font-medium">
      Click button below to add a cooling system
    </p>
    <button class="btn btn-primary" onclick="cooling_system_modal.showModal()">
      Add a cooling system
    </button>
  </div>
</template>

<template id="chiller-system-template">
  <div
    class="px-5 py-1.5 text-[var(--text--soft-400)] bg-[var(--bg--weak-50)] text-xs/4"
  >
    CHILLER SYSTEM DATA
  </div>
  <div class="px-5 py-4 grid grid-cols-2 gap-x-2.5 gap-y-1">
    <fieldset class="fieldset">
      <legend class="fieldset-legend">
        Chiller system<span class="text-[var(--state--error--base)]">*</span>
      </legend>
      <select class="select w-full" name="chiller_system" required>
        <option disabled selected value="">Select an option</option>
        <option value="water-cooled">Water cooled chiller</option>
        <option value="air-cooled">Air cooled chiller</option>
      </select>
    </fieldset>
    <fieldset class="fieldset">
      <legend class="fieldset-legend">
        Year of installation<span class="text-[var(--state--error--base)]"
          >*</span
        >
      </legend>
      <label class="input validator w-full">
        <input type="text" placeholder="eg. 2012" required min="1900" max="2099" name="year_of_installation" />
      </label>
      <p class="validator-hint">This field is required</p>
    </fieldset>
    <fieldset class="fieldset">
      <legend class="fieldset-legend">
        Type of refrigerants<span class="text-[var(--state--error--base)]"
          >*</span
        >
      </legend>
      <select
        class="select w-full"
        name="type_of_refrigerants"
        hx-get="/select_lists/?refrigerant_types=1"
        hx-trigger="load"
        hx-target="this"
        hx-swap="innerHTML"
      >
        <option disabled selected value="">Select an option</option>
      </select>
    </fieldset>
    <fieldset class="fieldset">
      <legend class="fieldset-legend">
        Refrigerant quantity<span class="text-[var(--state--error--base)]"
          >*</span
        ><span class="text-[var(--text--sub-600)]">(kg)</span>
      </legend>
      <label class="input validator w-full">
        <input type="number" placeholder="eg.  134" name="refrigerant_quantity" required min="0" />
        <span class="text-sm/5 align-middle text-[var(--text--sub-600)]"
          >kg</span
        >
      </label>
      <p class="validator-hint">This field is required</p>
    </fieldset>
    <fieldset class="fieldset">
      <legend class="fieldset-legend">
        Installation of variable speed drives<span
          class="text-[var(--state--error--base)]"
          >*</span
        ><span
          data-icon="info-custom-fill"
          data-size="20"
          data-color="var(--icon--disabled-300)"
        ></span>
      </legend>
      <div class="flex items-center gap-2.5">
        <label class="flex items-center gap-2">
          <input
            type="radio"
            name="installation_of_variable_speed_drives"
            class="radio radio-xs"
          />
          Yes
        </label>
        <label class="flex items-center gap-2">
          <input
            type="radio"
            name="installation_of_variable_speed_drives"
            class="radio radio-xs"
          />
          No
        </label>
      </div>
    </fieldset>
    <fieldset class="fieldset">
      <legend class="fieldset-legend">
        Installation of heat recovery systems<span
          class="text-[var(--state--error--base)]"
          >*</span
        ><span
          data-icon="info-custom-fill"
          data-size="20"
          data-color="var(--icon--disabled-300)"
        ></span>
      </legend>
      <div class="flex items-center gap-2.5">
        <label class="flex items-center gap-2">
          <input
            type="radio"
            name="installation_of_heat_recovery_systems"
            class="radio radio-xs"
          />
          Yes
        </label>
        <label class="flex items-center gap-2">
          <input
            type="radio"
            name="installation_of_heat_recovery_systems"
            class="radio radio-xs"
          />
          No
        </label>
      </div>
    </fieldset>
    <fieldset class="fieldset">
      <legend class="fieldset-legend">
        Total cooling load for chiller system<span
          class="text-[var(--state--error--base)]"
          >*</span
        >
      </legend>
      <label class="input validator w-full">
        <input type="text" placeholder="eg. 342" name="total_chiller_system"  required min="1" />
      </label>
      <p class="validator-hint">This field is required</p>
    </fieldset>

    <fieldset class="fieldset">
      <legend class="fieldset-legend">Baseline leakage factor</legend>
      <label class="input validator w-full">
        <input type="number" placeholder="eg. 2" name="baseline_leakage_factor" required min="1" />
        <span class="text-sm/5 align-middle text-[var(--text--sub-600)]"
          >%</span
        >
      </label>
      <p class="validator-hint">This field is required</p>
    </fieldset>

    <fieldset class="fieldset col-span-2">
      <legend class="fieldset-legend">
        Annual operating schedule<span
          data-icon="info-custom-fill"
          data-size="20"
          data-color="var(--icon--disabled-300)"
        ></span>
      </legend>
      <div class="w-full flex gap-1.5 items-center">
        <div class="flex-1">
          <label class="input validator w-full">
            <input type="number" placeholder="eg. 1" name="annual_operating_hours_per_day"  required min="1" max="24" />
            <span class="text-sm/5 align-middle text-[var(--text--sub-600)]"
              >Hours / day</span
            >
          </label>
        </div>
        <div class="flex-1">
          <label class="input validator w-full">
            <input type="number" placeholder="eg. 1" name="annual_operating_days_per_week"  required min="1" max="7" />
            <span class="text-sm/5 align-middle text-[var(--text--sub-600)]"
              >days / week</span
            >
          </label>
        </div>
        <div class="flex-1">
          <label class="input validator w-full">
            <input type="number" placeholder="eg. 1" name="annual_operating_weeks_per_year"  required min="1" max="52" />
            <span class="text-sm/5 align-middle text-[var(--text--sub-600)]"
              >weeks / year</span
            >
          </label>
        </div>
      </div>
    </fieldset>
    <fieldset class="fieldset col-span-2">
      <legend class="fieldset-legend">
        Baseline Air Cooled/Water Cooled Chiller Cooling Efficiency
      </legend>
      <label class="input w-full">
        <input type="number" placeholder="eg. 2" name="baseline_cooling_efficiency"  required min="1" />
      </label>
    </fieldset>
    <div class="col-span-2 mt-3">
      <div class="collapse rounded-none">
        <input type="checkbox" class="peer" />
        <div
          class="group collapse-title p-2.5 bg-[var(--bg--weak-50)] text-[0.813rem]/5 font-semibold flex items-center justify-between rounded-[var(--radius-4)]"
        >
          OTHER DETAILS
          <span
            data-icon="caret-down"
            data-size="16"
            data-color="var(--icon--soft-400)"
            class="transition-transform duration-300 ease-in-out group-[peer:checked]:rotate-180"
          ></span>
        </div>
        <div class="collapse-content mt-4 px-0">
          <div class="grid grid-cols-2 gap-2">
            <fieldset class="fieldset">
              <legend class="fieldset-legend">
                Number of chillers<span class="text-[var(--text--sub-600)]"
                  >(Optional)</span
                >
              </legend>
              <label class="input w-full">
                <input type="number" placeholder="eg. 2" name="number_of_chillers"  required min="0" />
              </label>
            </fieldset>
            <fieldset class="fieldset">
              <legend class="fieldset-legend">
                Total chiller system power input<span
                  class="text-[var(--text--sub-600)]"
                  >(Optional)</span
                >
              </legend>
              <label class="input w-full">
                <input type="number" placeholder="eg. 2000" name="total_chiller_system_power_input"  required min="0" />
                <span class="text-sm/5 align-middle text-[var(--text--sub-600)]"
                  >kWH</span
                >
              </label>
            </fieldset>
            <fieldset class="fieldset col-span-2">
              <legend class="fieldset-legend">
                Water-cooled chiller cooling load factor<span
                  class="text-[var(--text--sub-600)]"
                  >(Optional) %</span
                >
              </legend>
              <label class="input w-full">
                <input type="number" placeholder="eg. 45" name="water_cooled_chiller_cooling_load_factor"  required min="0"/>
                <span class="text-sm/5 align-middle text-[var(--text--sub-600)]"
                  >%</span
                >
              </label>
            </fieldset>
            <fieldset class="fieldset">
              <legend class="fieldset-legend">COP</legend>
              <label class="input w-full">
                <input type="number" placeholder="eg. 2" name="cop"  required min="0" />
              </label>
            </fieldset>
            <fieldset class="fieldset">
              <legend class="fieldset-legend">IPVL</legend>
              <label class="input w-full">
                <input type="number" placeholder="eg. 2" name="ipvl"  required min="0" />
              </label>
            </fieldset>
            <fieldset class="fieldset">
              <legend class="fieldset-legend">Energy efficiency label</legend>
              <select class="select w-full" name="energy_efficiency_label"  required>
                <option disabled selected value="">Select an option</option>
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
                <option value="D">D</option>
                <option value="E">E</option>
                <option value="F">F</option>
                <option value="G">G</option>
              </select>
            </fieldset>
            <fieldset class="fieldset">
              <legend class="fieldset-legend">Number of stars</legend>
              <select class="select w-full" name="number_of_stars" required>
                <option disabled selected value="">Select an option</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
              </select>
            </fieldset>
            <fieldset class="fieldset col-span-2">
              <legend class="fieldset-legend">
                Total energy consumption of chiller system anually (kwh/year)
              </legend>
              <label class="input w-full">
                <input type="number" placeholder="eg. 200" name="total_energy_consumption_of_chiller_system_annually"  required min="0" />
                <span class="text-sm/5 align-middle text-[var(--text--sub-600)]"
                  >kWh/year</span
                >
              </label>
            </fieldset>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>

<template id="air-condition-system-template">
  <div
    class="px-5 py-1.5 text-[var(--text--soft-400)] bg-[var(--bg--weak-50)] text-xs/4"
  >
    AIR CONDITION SYSTEM DATA
  </div>
  <div class="px-5 py-4 grid grid-cols-2 gap-x-2.5 gap-y-1">
    <fieldset class="fieldset">
      <legend class="fieldset-legend">
        Type of air condition<span class="text-[var(--state--error--base)]"
          >*</span
        >
      </legend>
      <select class="select w-full" name="type_of_air_condition">
        <option disabled selected value="">Select an option</option>
        <option value="split">Split air condition</option>
        <option value="VRV">
          Variable Refrigerant Volume (VRV) / Variable Refrigerant Flow (VRF)
        </option>
      </select>
    </fieldset>
    <fieldset class="fieldset">
      <legend class="fieldset-legend">
        Year of installation<span class="text-[var(--state--error--base)]"
          >*</span
        >
      </legend>
      <label class="input validator w-full">
        <input type="text" placeholder="eg. 2012" name="year_of_installation" />
      </label>
      <p class="validator-hint">This field is required</p>
    </fieldset>
    <fieldset class="fieldset">
      <legend class="fieldset-legend">
        Type of refrigerants<span class="text-[var(--state--error--base)]"
          >*</span
        >
      </legend>
      <select
        class="select w-full"
        name="type_of_refrigerants"
        hx-get="/select_lists/?refrigerant_types=1"
        hx-trigger="load"
        hx-target="this"
        hx-swap="innerHTML"
      >
        <option disabled selected value="">Select an option</option>
      </select>
    </fieldset>
    <fieldset class="fieldset">
      <legend class="fieldset-legend">
        Refrigerant quantity<span class="text-[var(--state--error--base)]"
          >*</span
        ><span class="text-[var(--text--sub-600)]">(kg)</span>
      </legend>
      <label class="input validator w-full">
        <input type="number" placeholder="eg.  134" name="refrigerant_quantity" />
        <span class="text-sm/5 align-middle text-[var(--text--sub-600)]"
          >kg</span
        >
      </label>
      <p class="validator-hint">This field is required</p>
    </fieldset>
    <fieldset class="fieldset">
      <legend class="fieldset-legend">
        Total cooling load for split/VRV<span
          class="text-[var(--state--error--base)]"
          >*</span
        >
      </legend>
      <label class="input validator w-full">
        <input type="text" placeholder="eg. 342" name="total_cooling_load_for_split_vrv" />
      </label>
      <p class="validator-hint">This field is required</p>
    </fieldset>
    <fieldset class="fieldset">
      <legend class="fieldset-legend">Baseline leakage factor</legend>
      <label class="input validator w-full">
        <input type="number" placeholder="eg. 2" name="baseline_leakage_factor" />
        <span class="text-sm/5 align-middle text-[var(--text--sub-600)]"
          >%</span
        >
      </label>
      <p class="validator-hint">This field is required</p>
    </fieldset>
    <fieldset class="fieldset col-span-2">
      <legend class="fieldset-legend">
        System operating schedule<span
          data-icon="info-custom-fill"
          data-size="20"
          data-color="var(--icon--disabled-300)"
        ></span>
      </legend>
      <div class="w-full flex gap-1.5 items-center">
        <div class="flex-1">
          <label class="input validator w-full">
            <input type="number" placeholder="eg. 1" name="hours_per_day" required min="1" max="24" />
            <span class="text-sm/5 align-middle text-[var(--text--sub-600)]"
              >Hours / day</span
            >
          </label>
        </div>
        <div class="flex-1">
          <label class="input validator w-full">
            <input type="number" placeholder="eg. 1" name="days_per_week" required min="1" max="7" />
            <span class="text-sm/5 align-middle text-[var(--text--sub-600)]"
              >days / week</span
            >
          </label>
        </div>
        <div class="flex-1">
          <label class="input validator w-full">
            <input type="number" placeholder="eg. 1" name="weeks_per_year" required min="1" max="52" />
            <span class="text-sm/5 align-middle text-[var(--text--sub-600)]"
              >weeks / year</span
            >
          </label>
        </div>
      </div>
    </fieldset>
    <div class="col-span-2 mt-3">
      <div class="collapse rounded-none">
        <input type="checkbox" class="peer" />
        <div
          class="group collapse-title p-2.5 bg-[var(--bg--weak-50)] text-[0.813rem]/5 font-semibold flex items-center justify-between rounded-[var(--radius-4)]"
        >
          OTHER DETAILS
          <span
            data-icon="caret-down"
            data-size="16"
            data-color="var(--icon--soft-400)"
            class="transition-transform duration-300 ease-in-out group-[peer:checked]:rotate-180"
          ></span>
        </div>
        <div class="collapse-content mt-4 px-0">
          <div class="grid grid-cols-2 gap-2">
            <fieldset class="fieldset">
              <legend class="fieldset-legend">
                Total number of split/VRV units
              </legend>
              <label class="input w-full">
                <input type="number" placeholder="eg. 2" name="total_number_of_split_vrv_units" />
              </label>
            </fieldset>
            <fieldset class="fieldset">
              <legend class="fieldset-legend">
                Total split unit//VRV system
              </legend>
              <label class="input w-full">
                <input type="number" placeholder="eg. 400" name="total_split_unit_vrv_system" />
                <span class="text-sm/5 align-middle text-[var(--text--sub-600)]"
                  >kW</span
                >
              </label>
            </fieldset>
            <fieldset class="fieldset col-span-2">
              <legend class="fieldset-legend">
                Total energy consumption of chiller system annually<span
                  class="text-[var(--text--sub-600)]"
                  >(kWh/year)</span
                >
              </legend>
              <label class="input w-full">
                <input type="number" placeholder="eg. 200" name="total_chiller_system_annually" />
                <span class="text-sm/5 align-middle text-[var(--text--sub-600)]"
                  >%</span
                >
              </label>
            </fieldset>
            <fieldset class="fieldset col-span-2">
              <legend class="fieldset-legend">
                Baseline split unit/VRV system efficiency
              </legend>
              <label class="input w-full">
                <input type="number" placeholder="eg. 333" name="baseline_split_unit_vrv_system_efficiency" />
                <span class="text-sm/5 align-middle text-[var(--text--sub-600)]"
                  >watt</span
                >
              </label>
            </fieldset>
            <fieldset class="fieldset">
              <legend class="fieldset-legend">ISSER rating</legend>
              <label class="input w-full">
                <input type="number" placeholder="eg. 4.5" name="isser_rating" />
              </label>
            </fieldset>
            <fieldset class="fieldset">
              <legend class="fieldset-legend">COP</legend>
              <label class="input w-full">
                <input type="number" placeholder="eg. 2" name="cop" />
              </label>
            </fieldset>

            <fieldset class="fieldset">
              <legend class="fieldset-legend">Energy efficiency label</legend>
              <select class="select w-full" name="energy_efficiency_label">
                <option disabled selected value="">Select an option</option>
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
                <option value="D">D</option>
                <option value="E">E</option>
                <option value="F">F</option>
                <option value="G">G</option>
              </select>
            </fieldset>
            <fieldset class="fieldset">
              <legend class="fieldset-legend">Number of stars</legend>
              <select class="select w-full" name="number_of_stars">
                <option disabled selected value="">Select an option</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
              </select>
            </fieldset>
            <fieldset class="fieldset col-span-2">
              <legend class="fieldset-legend">
                Total energy consumption of chiller system anually (kwh/year)
              </legend>
              <label class="input w-full">
                <input type="number" placeholder="eg. 200" name="total_chiller_system_annually" />
                <span class="text-sm/5 align-middle text-[var(--text--sub-600)]"
                  >kWh/year</span
                >
              </label>
            </fieldset>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>

<script>
  // Store editing system ID and type on window
  if (!window.editingCoolingSystemId) {
    window.editingCoolingSystemId = null;
  }
  if (!window.editingCoolingSystemType) {
    window.editingCoolingSystemType = null;
  }

  // Get CSRF token
  function getCSRFToken() {
    return document.querySelector('[name=csrfmiddlewaretoken]').value;
  }

  // Get building UUID from URL parameters
  function getBuildingId() {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get('building_uuid');
  }

  // Open modal for adding new system
  window.openCoolingSystemModal = function() {
    window.editingCoolingSystemId = null;
    window.editingCoolingSystemType = null;
    document.getElementById('cooling-system-form').reset();
    document.getElementById('selected-cooling-system').innerHTML = '';
    cooling_system_modal.showModal();
  }

  // Close modal
  window.closeCoolingSystemModal = function() {
    cooling_system_modal.close();
    window.editingCoolingSystemId = null;
    window.editingCoolingSystemType = null;
  }

  // Handle cooling system type change
  window.handleCoolingSystemTypeChange = function(systemType) {
    const selectedSystemDiv = document.getElementById('selected-cooling-system');

    if (!systemType) {
      selectedSystemDiv.innerHTML = '';
      return;
    }

    // Get the selected option text
    const selectElement = document.getElementById('cooling-system-type');
    const selectedText = selectElement.options[selectElement.selectedIndex].text;

    // Determine which template to load based on system type
    if (selectedText.toLowerCase().includes('chiller')) {
      loadTemplate('chiller-system-template', selectedSystemDiv);
    } else {
      loadTemplate('air-condition-system-template', selectedSystemDiv);
    }
  }

  // Load template content
  function loadTemplate(templateId, targetElement) {
    const template = document.getElementById(templateId);
    if (template) {
      targetElement.innerHTML = template.innerHTML;

      // Process HTMX attributes in the newly loaded template
      if (typeof htmx !== 'undefined') {
        htmx.process(targetElement);
      }
    }
  }

  // Save cooling system
  window.saveCoolingSystem = async function() {
    const form = document.getElementById('cooling-system-form');
    const formData = new FormData(form);
    const buildingId = getBuildingId();

    if (!buildingId) {
      Toast.error('Building ID not found');
      return;
    }

    //validate required fields
    const validator = new window.FormValidator(form);
    if (!validator.validate()) {
      console.error('Form validation failed', validator.errors);
      return;
    }

    // Get cooling system type
    const systemTypeSelect = document.getElementById('cooling-system-type');
    const systemType = systemTypeSelect.value;
    const systemTypeName = systemTypeSelect.options[systemTypeSelect.selectedIndex].text;

    if (!systemType) {
      Toast.error('Please select a cooling system type');
      return;
    }

    // Determine if this is chiller or air conditioner
    const isChiller = systemTypeName.toLowerCase().includes('chiller');
    const cooling_system_type = isChiller ? 'chiller' : 'air_conditioner';

    // Collect all form data
    const systemData = {
      building_uuid: buildingId,
      cooling_system_type: cooling_system_type,
    };

    // Add system ID if editing
    if (window.editingCoolingSystemId) {
      systemData.cooling_system_id = window.editingCoolingSystemId;
    }

    // Add all form fields (skip csrftoken and cooling_system_type as we already set it)
    for (const [key, value] of formData.entries()) {
      if (key !== 'csrfmiddlewaretoken' && key !== 'cooling_system_type') {
        systemData[key] = value;
      }
    }

    try {
      const method = window.editingCoolingSystemId ? 'PUT' : 'POST';
      const response = await fetch('/cooling-system/', {
        method: method,
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': getCSRFToken(),
        },
        body: JSON.stringify(systemData),
      });

      const result = await response.json();

      if (result.success) {
        // Refresh the list
        await window.renderCoolingSystems();
        // Close modal
        window.closeCoolingSystemModal();
      } else {
        Toast.error('Error saving cooling system: ' + JSON.stringify(result.errors));
      }
    } catch (error) {
      console.error('Error:', error);
      Toast.error('An error occurred while saving the cooling system');
    }
  }

  // Render cooling systems list
  window.renderCoolingSystems = async function() {
    const buildingId = getBuildingId();
    if (!buildingId) {
      console.error('Building ID not found');
      return;
    }

    const listContainer = document.getElementById('cooling-systems-list');

    try {
      const response = await fetch(`/cooling-system/${buildingId}/`, {
        method: 'GET',
        headers: {
          'Content-Type': 'application/json',
        },
      });

      const result = await response.json();

      if (result.success && result.cooling_systems) {
        const systems = result.cooling_systems;

        if (systems.length === 0) {
          listContainer.innerHTML = `
            <li class="flex flex-col items-center justify-center py-8 text-center">
              <span data-icon="snowflake-fill" data-size="48" data-color="var(--icon--soft-400)"></span>
              <p class="text-sm/5 text-[var(--text--sub-600)] mt-2">No cooling systems added yet</p>
            </li>
          `;
          return;
        }

        listContainer.innerHTML = systems.map((system) => {
          const refrigerantType = system.refrigerant_type || 'N/A';
          const refrigerantQty = system.refrigerant_quantity_kg || 'N/A';

          let systemTypeName = '';
          let chillerType = '';

          if (system.cooling_system_type === 'chiller') {
            systemTypeName = 'Chiller System';
            chillerType = system.chiller_type_display || '';
          } else {
            systemTypeName = 'Air Conditioner';
            chillerType = system.ac_type_display || '';
          }

          return `
            <li class="flex items-center justify-between gap-1.5 w-full p-2.5 rounded-[var(--radius-8)] bg-[var(--bg--weak-50)] border border-[var(--stroke--soft-200)] mb-2">
              <span
                data-icon="snowflake-fill"
                data-size="20"
                data-color="var(--icon--strong-950)"
                class="shrink-0 self-start"
              ></span>
              <div class="flex flex-col flex-1">
                <p class="text-sm/5 font-medium">
                  ${systemTypeName}${chillerType ? ' - ' + chillerType : ''}
                </p>
                <p class="text-sm/5 text-[var(--text--sub-600)] gap-0">
                  <span class="border-r border-[var(--text--sub-600)] pr-1">Type: ${refrigerantType}</span>
                  <span>Refrigerant quantity: ${refrigerantQty} kg</span>
                </p>
              </div>
              <div class="flex items-center gap-3">
                <button class="btn size-5 btn-ghost p-0" onclick="editCoolingSystem(${system.id}, '${system.cooling_system_type}')">
                  <span
                    data-icon="edit-line"
                    data-size="16"
                    data-color="var(--icon--strong-950)"
                  ></span>
                </button>
                <button
                  class="btn size-5 btn-ghost p-0"
                  onclick="confirmDeleteCoolingSystem(${system.id}, '${system.cooling_system_type}')"
                >
                  <span
                    data-icon="delete-bin-5-line"
                    data-size="16"
                    data-color="var(--icon--strong-950)"
                  ></span>
                </button>
              </div>
            </li>
          `;
        }).join('');
      } else {
        console.error('Error fetching cooling systems:', result.errors);
      }
    } catch (error) {
      console.error('Error:', error);
    }
  }

  // Edit cooling system
  window.editCoolingSystem = async function(systemId, coolingSystemType) {
    const buildingId = getBuildingId();

    if (!buildingId) {
      Toast.error('Building ID not found');
      return;
    }

    try {
      const response = await fetch(`/cooling-system/${buildingId}/`, {
        method: 'GET',
        headers: {
          'Content-Type': 'application/json',
        },
      });

      const result = await response.json();

      if (result.success && result.cooling_systems) {
        const system = result.cooling_systems.find(s => s.id === systemId && s.cooling_system_type === coolingSystemType);

        if (system) {
          window.editingCoolingSystemId = systemId;
          window.editingCoolingSystemType = coolingSystemType;

          // Reset form
          document.getElementById('cooling-system-form').reset();

          // Set system type in dropdown and trigger template load
          const systemTypeSelect = document.getElementById('cooling-system-type');
          // We need to find the option that corresponds to this system type
          // For now, trigger the change after setting a placeholder value
          if (system.cooling_system_type === 'chiller') {
            // Find chiller option
            for (let option of systemTypeSelect.options) {
              if (option.text.toLowerCase().includes('chiller')) {
                systemTypeSelect.value = option.value;
                break;
              }
            }
          } else {
            // Find air conditioner option
            for (let option of systemTypeSelect.options) {
              if (option.text.toLowerCase().includes('air') || option.text.toLowerCase().includes('vr')) {
                systemTypeSelect.value = option.value;
                break;
              }
            }
          }

          // Trigger template load
          window.handleCoolingSystemTypeChange(systemTypeSelect.value);

          // Wait for template to load, then populate fields
          setTimeout(() => {
            const form = document.getElementById('cooling-system-form');

            if (system.cooling_system_type === 'chiller') {
              // Populate chiller fields
              const chillerTypeMapping = {
                'water_cooled': 'water-cooled',
                'air_cooled': 'air-cooled',
              };
              if (form.querySelector('[name="chiller_system"]')) {
                form.querySelector('[name="chiller_system"]').value = chillerTypeMapping[system.chiller_type] || system.chiller_type;
              }
              if (form.querySelector('[name="year_of_installation"]')) {
                form.querySelector('[name="year_of_installation"]').value = system.year_of_installation;
              }
              if (form.querySelector('[name="type_of_refrigerants"]')) {
                form.querySelector('[name="type_of_refrigerants"]').value = system.refrigerant_type;
              }
              if (form.querySelector('[name="refrigerant_quantity"]')) {
                form.querySelector('[name="refrigerant_quantity"]').value = system.refrigerant_quantity_kg;
              }

              // Set radio buttons for boolean fields
              if (system.variable_speed_drives !== null) {
                const vsdValue = system.variable_speed_drives ? 'yes' : 'no';
                const vsdRadio = form.querySelector(`[name="installation_of_variable_speed_drives"][value="${vsdValue}"]`);
                if (vsdRadio) vsdRadio.checked = true;
              }
              if (system.heat_recovery_system !== null) {
                const hrsValue = system.heat_recovery_system ? 'yes' : 'no';
                const hrsRadio = form.querySelector(`[name="installation_of_heat_recovery_systems"][value="${hrsValue}"]`);
                if (hrsRadio) hrsRadio.checked = true;
              }

              if (form.querySelector('[name="total_chiller_system"]')) {
                form.querySelector('[name="total_chiller_system"]').value = system.total_cooling_load_rt;
              }
              if (form.querySelector('[name="baseline_leakage_factor"]')) {
                form.querySelector('[name="baseline_leakage_factor"]').value = system.baseline_leakage_factor_percent;
              }
              if (form.querySelector('[name="annual_operating_hours_per_day"]')) {
                form.querySelector('[name="annual_operating_hours_per_day"]').value = system.operation_hours_per_workday;
              }
              if (form.querySelector('[name="annual_operating_days_per_week"]')) {
                form.querySelector('[name="annual_operating_days_per_week"]').value = system.workdays_per_week;
              }
              if (form.querySelector('[name="annual_operating_weeks_per_year"]')) {
                form.querySelector('[name="annual_operating_weeks_per_year"]').value = system.workweeks_per_year;
              }
              if (form.querySelector('[name="baseline_cooling_efficiency"]') && system.baseline_cooling_efficiency_kw_h) {
                form.querySelector('[name="baseline_cooling_efficiency"]').value = system.baseline_cooling_efficiency_kw_h;
              }
              if (form.querySelector('[name="number_of_chillers"]') && system.number_of_chillers) {
                form.querySelector('[name="number_of_chillers"]').value = system.number_of_chillers;
              }
              if (form.querySelector('[name="total_chiller_system_power_input"]') && system.total_chiller_system_power_input_kw) {
                form.querySelector('[name="total_chiller_system_power_input"]').value = system.total_chiller_system_power_input_kw;
              }
              if (form.querySelector('[name="water_cooled_chiller_cooling_load_factor"]') && system.water_cooled_chiller_cooling_load_factor_percent) {
                form.querySelector('[name="water_cooled_chiller_cooling_load_factor"]').value = system.water_cooled_chiller_cooling_load_factor_percent;
              }
              if (form.querySelector('[name="cop"]') && system.cop) {
                form.querySelector('[name="cop"]').value = system.cop;
              }
              if (form.querySelector('[name="ipvl"]') && system.ip_lv) {
                form.querySelector('[name="ipvl"]').value = system.ip_lv;
              }
              if (form.querySelector('[name="energy_efficiency_label"]') && system.energy_efficiency_label) {
                form.querySelector('[name="energy_efficiency_label"]').value = system.energy_efficiency_label;
              }
              if (form.querySelector('[name="number_of_stars"]') && system.energy_efficiency_label) {
                form.querySelector('[name="number_of_stars"]').value = system.energy_efficiency_label;
              }
              if (form.querySelector('[name="total_energy_consumption_of_chiller_system_annually"]') && system.total_energy_consumption_kwh_per_year) {
                form.querySelector('[name="total_energy_consumption_of_chiller_system_annually"]').value = system.total_energy_consumption_kwh_per_year;
              }
            } else {
              // Populate air conditioner fields
              if (form.querySelector('[name="type_of_air_condition"]')) {
                form.querySelector('[name="type_of_air_condition"]').value = system.ac_type;
              }
              if (form.querySelector('[name="year_of_installation"]')) {
                form.querySelector('[name="year_of_installation"]').value = system.year_of_installation;
              }
              if (form.querySelector('[name="type_of_refrigerants"]')) {
                form.querySelector('[name="type_of_refrigerants"]').value = system.refrigerant_type;
              }
              if (form.querySelector('[name="refrigerant_quantity"]')) {
                form.querySelector('[name="refrigerant_quantity"]').value = system.refrigerant_quantity_kg;
              }
              if (form.querySelector('[name="total_cooling_load_for_split_vrv"]')) {
                form.querySelector('[name="total_cooling_load_for_split_vrv"]').value = system.total_cooling_load_rt;
              }
              if (form.querySelector('[name="baseline_leakage_factor"]')) {
                form.querySelector('[name="baseline_leakage_factor"]').value = system.baseline_leakage_factor_percent;
              }
              if (form.querySelector('[name="hours_per_day"]')) {
                form.querySelector('[name="hours_per_day"]').value = system.operation_hours_per_workday;
              }
              if (form.querySelector('[name="days_per_week"]')) {
                form.querySelector('[name="days_per_week"]').value = system.workdays_per_week;
              }
              if (form.querySelector('[name="weeks_per_year"]')) {
                form.querySelector('[name="weeks_per_year"]').value = system.workweeks_per_year;
              }
              if (form.querySelector('[name="total_number_of_split_vrv_units"]') && system.number_of_units) {
                form.querySelector('[name="total_number_of_split_vrv_units"]').value = system.number_of_units;
              }
              if (form.querySelector('[name="total_split_unit_vrv_system"]') && system.total_system_power_kw) {
                form.querySelector('[name="total_split_unit_vrv_system"]').value = system.total_system_power_kw;
              }
              if (form.querySelector('[name="baseline_split_unit_vrv_system_efficiency"]') && system.baseline_efficiency_kw_per_rt) {
                form.querySelector('[name="baseline_split_unit_vrv_system_efficiency"]').value = system.baseline_efficiency_kw_per_rt;
              }
              if (form.querySelector('[name="isser_rating"]') && system.iseer_rating) {
                form.querySelector('[name="isser_rating"]').value = system.iseer_rating;
              }
              if (form.querySelector('[name="cop"]') && system.cop) {
                form.querySelector('[name="cop"]').value = system.cop;
              }
              if (form.querySelector('[name="energy_efficiency_label"]') && system.energy_efficiency_label) {
                form.querySelector('[name="energy_efficiency_label"]').value = system.energy_efficiency_label;
              }
              if (form.querySelector('[name="number_of_stars"]') && system.energy_efficiency_label) {
                form.querySelector('[name="number_of_stars"]').value = system.energy_efficiency_label;
              }
              if (form.querySelector('[name="total_chiller_system_annually"]') && system.total_energy_consumption_kwh_per_year) {
                form.querySelector('[name="total_chiller_system_annually"]').value = system.total_energy_consumption_kwh_per_year;
              }
            }
          }, 200);

          cooling_system_modal.showModal();
        }
      }
    } catch (error) {
      console.error('Error:', error);
      Toast.error('An error occurred while loading the cooling system');
    }
  }

  // Confirm delete
  if (!window.deleteCoolingSystemId) {
    window.deleteCoolingSystemId = null;
  }
  if (!window.deleteCoolingSystemType) {
    window.deleteCoolingSystemType = null;
  }

  window.confirmDeleteCoolingSystem = function(systemId, coolingSystemType) {
    window.deleteCoolingSystemId = systemId;
    window.deleteCoolingSystemType = coolingSystemType;
    cooling_system_modal_delete.showModal();
  }

  // Delete cooling system
  window.deleteCoolingSystem = async function() {
    if (window.deleteCoolingSystemId !== null && window.deleteCoolingSystemType !== null) {
      try {
        const response = await fetch(`/cooling-system/${window.deleteCoolingSystemId}/delete/?cooling_system_type=${window.deleteCoolingSystemType}`, {
          method: 'DELETE',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCSRFToken(),
          },
        });

        const result = await response.json();

        if (result.success) {
          await window.renderCoolingSystems();
          window.deleteCoolingSystemId = null;
          window.deleteCoolingSystemType = null;
          cooling_system_modal_delete.close();
        } else {
          Toast.error('Error deleting cooling system: ' + JSON.stringify(result.errors));
        }
      } catch (error) {
        console.error('Error:', error);
        Toast.error('An error occurred while deleting the cooling system');
      }
    }
  }

  // Initialize on page load
  document.addEventListener('DOMContentLoaded', function() {
    if (document.getElementById('cooling-systems-list')) {
      window.renderCoolingSystems();
    }
  });

  // If HTMX is processing this content dynamically, also initialize after htmx:afterSwap
  document.addEventListener('htmx:afterSwap', function(evt) {
    if (evt.detail.target.id === 'dynamic-content') {
      window.renderCoolingSystems();
    }
  });

  // Initialize immediately for dynamically loaded content
  if (document.getElementById('cooling-systems-list')) {
    window.renderCoolingSystems();
  }
</script>

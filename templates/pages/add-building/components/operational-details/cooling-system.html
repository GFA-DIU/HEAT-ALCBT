{% load static %}
<div id="cooling-system-container" class="w-full">
  <div class="w-full flex flex-col">
    <button
      class="btn btn-outline w-fit"
      onclick="openCoolingSystemModal()"
    >
      <span
        data-icon="add-large-fill"
        data-size="20"
        data-color="var(--icon--strong-950)"
      ></span>
      Add a cooling system
    </button>
    <div
      class="divider before:h-[0.0625rem] after:h-[0.0625rem] before:bg-[var(--stroke--soft-200)] after:bg-[var(--stroke--soft-200)]"
    ></div>
    <ul class="grid grid-cols-1 gap-2" id="cooling-systems-list">
      <!-- Cooling systems will be added here dynamically -->
    </ul>
  </div>
</div>

<dialog id="cooling_system_modal" class="modal modal-bottom sm:modal-end">
  <div
    class="modal-box p-0 !h-[97vh] my-auto mr-3.5 !w-full !max-w-[40.375rem] rounded-[1.25rem] overflow-y-auto flex flex-col justify-between"
  >
    <div class="flex justify-between p-5 w-full">
      <div class="flex flex-col">
        <h3 class="text-lg/6 font-medium">Add a cooling system</h3>
        <p class="text-sm/5 text-[var(--text--sub-600)]">
          Enter details of the building’s cooling system, including type and
          capacity
        </p>
      </div>
      <button
        type="button"
        onclick="cooling_system_modal.close()"
        class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2"
      >
        <span
          data-icon="close-line"
          data-size="16"
          data-color="var(--icon--sub-600)"
        ></span>
      </button>
    </div>
    <form id="cooling-system-form" class="flex-1 overflow-y-auto hide-scrollbar">
      <div class="px-5 py-4">
        <fieldset class="fieldset">
          <legend class="fieldset-legend">Type of cooling system</legend>
          <select
            class="select w-full"
            id="cooling-system-type"
            name="cooling_system_type"
            hx-get="/select_lists/?cooling_types=1"
            hx-trigger="load"
            hx-target="this"
            hx-swap="innerHTML"
            onchange="handleCoolingSystemTypeChange(this.value)"
          >
            <option value="">Select a cooling system</option>
          </select>
        </fieldset>
      </div>

      <div id="selected-cooling-system"></div>
    </form>
    <div
      class="p-5 border-t border-[var(--stroke--soft-200)] flex gap-4 items-center justify-between w-full"
    >
      <button
        type="button"
        class="btn flex-1 btn-sm btn-outline text-[var(--text--sub-600)] border-[var(--stroke--soft-200)]"
        onclick="closeCoolingSystemModal()"
      >
        Cancel
      </button>
      <button 
        type="button" 
        class="btn flex-1 btn-sm btn-primary"
        onclick="saveCoolingSystem()"
      >
        Save
      </button>
    </div>
  </div>
</dialog>

<dialog id="cooling_system_modal_delete" class="modal modal-middle">
  <div class="modal-box w-full max-w-[26.375rem] p-0">
    <div class="flex flex-col items-center p-5">
      <div
        class="flex items-center p-2 justify-center rounded-[var(--radius-8)] bg-[var(--state--warning--lighter)]"
      >
        <span
          data-icon="alert-fill"
          data-size="24"
          data-color="var(--state--warning--base)"
        ></span>
      </div>
      <h3 class="text-lg/6 font-medium mt-4">Are you sure?</h3>
      <p class="text-sm/5 text-[var(--text--sub-600)] text-center mt-1">
        You are about to remove or delete added cooling system. This will action
        will permanently remove it.
      </p>
    </div>
    <div
      class="p-5 border-t border-[var(--stroke--soft-200)] flex gap-4 items-center justify-between w-full"
    >
      <button
        class="btn btn-sm btn-outline text-[var(--text--sub-600)] border-[var(--stroke--soft-200)] flex-1"
        onclick="cooling_system_modal_delete.close()"
      >
        Cancel
      </button>
      <button class="btn btn-sm btn-error flex-1" onclick="deleteCoolingSystem()">Remove</button>
    </div>
  </div>
</dialog>

<template id="cooling-system-template">
  <div class="w-full flex flex-col">
    <button
      class="btn btn-outline w-fit"
      onclick="cooling_system_modal.showModal()"
    >
      <span
        data-icon="add-large-fill"
        data-size="20"
        data-color="var(--icon--strong-950)"
      ></span>
      Add a cooling system
    </button>
    <div
      class="divider before:h-[0.0625rem] after:h-[0.0625rem] before:bg-[var(--stroke--soft-200)] after:bg-[var(--stroke--soft-200)]"
    ></div>
    <ul class="grid grid-cols-1">
      <li
        class="flex items-center justify-between gap-1.5 w-full p-2.5 rounded-[var(--radius-8)] bg-[var(--bg--weak-50)] border border-[var(--stroke--soft-200)]"
      >
        <span
          data-icon="snowflake-fill"
          data-size="20"
          data-color="var(--icon--strong-950)"
          class="shrink-0 self-start"
        ></span>
        <div class="flex flex-col flex-1">
          <p class="text-sm/5 font-medium">
            Chiller system - Water cooled chiller
          </p>
          <p class="text-sm/5 text-[var(--text--sub-600)] gap-0">
            <span class="border-r border-[var(--text--sub-600)] pr-1"
              >Type: R-290 Propane</span
            >
            <span>Refrigerant quantity: 23 kg</span>
          </p>
        </div>
        <div class="flex items-center gap-3">
          <button class="btn size-5 btn-ghost p-0">
            <span
              data-icon="edit-line"
              data-size="16"
              data-color="var(--icon--strong-950)"
            ></span>
          </button>
          <button
            class="btn size-5 btn-ghost p-0"
            onclick="cooling_system_modal_delete.showModal()"
          >
            <span
              data-icon="delete-bin-5-line"
              data-size="16"
              data-color="var(--icon--strong-950)"
            ></span>
          </button>
        </div>
      </li>
    </ul>
  </div>
</template>

<template id="no-cooling-system-template">
  <div class="w-full flex flex-col gap-3 items-center justify-center">
    <img src="{% static 'assets/cooling-system.png' %}" alt="Cooling System Image" />
    <p class="text-sm/5 font-medium">
      Click button below to add a cooling system
    </p>
    <button class="btn btn-primary" onclick="cooling_system_modal.showModal()">
      Add a cooling system
    </button>
  </div>
</template>

<template id="chiller-system-template">
  <div
    class="px-5 py-1.5 text-[var(--text--soft-400)] bg-[var(--bg--weak-50)] text-xs/4"
  >
    CHILLER SYSTEM DATA
  </div>
  <div class="px-5 py-4 grid grid-cols-2 gap-x-2.5 gap-y-1">
    <fieldset class="fieldset">
      <legend class="fieldset-legend">
        Chiller system<span class="text-[var(--state--error--base)]">*</span>
      </legend>
      <select class="select w-full" name="chiller_system">
        <option disabled selected value="">Select an option</option>
        <option value="water-cooled">Water cooled chiller</option>
        <option value="air-cooled">Air cooled chiller</option>
      </select>
    </fieldset>
    <fieldset class="fieldset">
      <legend class="fieldset-legend">
        Year of installation<span class="text-[var(--state--error--base)]"
          >*</span
        >
      </legend>
      <label class="input validator w-full">
        <input type="text" placeholder="eg. 2012" name="year_of_installation" />
      </label>
      <p class="validator-hint">This field is required</p>
    </fieldset>
    <fieldset class="fieldset">
      <legend class="fieldset-legend">
        Type of refrigerants<span class="text-[var(--state--error--base)]"
          >*</span
        >
      </legend>
      <select class="select w-full" name="type_of_refrigerants">
        <option disabled selected value="">Select an option</option>
        <option value="R-134A">R-134A</option>
        <option value="R-32">R-32</option>
        <option value="R-410A">R-410A</option>
        <option value="R-290 (Propane)">R-290 (Propane)</option>
        <option value="R-600a (Isobutane)">R-600a (Isobutane)</option>
        <option value="R-717 (Ammonia)">R-717 (Ammonia)</option>
        <option value="R-744 (C02)">R-744 (C02)</option>
        <option value="R-404A">R-404A</option>
      </select>
    </fieldset>
    <fieldset class="fieldset">
      <legend class="fieldset-legend">
        Refrigerant quantity<span class="text-[var(--state--error--base)]"
          >*</span
        ><span class="text-[var(--text--sub-600)]">(kg)</span>
      </legend>
      <label class="input validator w-full">
        <input type="number" placeholder="eg.  134" name="refrigerant_quantity" />
        <span class="text-sm/5 align-middle text-[var(--text--sub-600)]"
          >kg</span
        >
      </label>
      <p class="validator-hint">This field is required</p>
    </fieldset>
    <fieldset class="fieldset">
      <legend class="fieldset-legend">
        Installation of variable speed drives<span
          class="text-[var(--state--error--base)]"
          >*</span
        ><span
          data-icon="info-custom-fill"
          data-size="20"
          data-color="var(--icon--disabled-300)"
        ></span>
      </legend>
      <div class="flex items-center gap-2.5">
        <label class="flex items-center gap-2">
          <input
            type="radio"
            name="installation_of_variable_speed_drives"
            class="radio radio-xs"
          />
          Yes
        </label>
        <label class="flex items-center gap-2">
          <input
            type="radio"
            name="installation_of_variable_speed_drives"
            class="radio radio-xs"
          />
          No
        </label>
      </div>
    </fieldset>
    <fieldset class="fieldset">
      <legend class="fieldset-legend">
        Installation of heat recovery systems<span
          class="text-[var(--state--error--base)]"
          >*</span
        ><span
          data-icon="info-custom-fill"
          data-size="20"
          data-color="var(--icon--disabled-300)"
        ></span>
      </legend>
      <div class="flex items-center gap-2.5">
        <label class="flex items-center gap-2">
          <input
            type="radio"
            name="installation_of_heat_recovery_systems"
            class="radio radio-xs"
          />
          Yes
        </label>
        <label class="flex items-center gap-2">
          <input
            type="radio"
            name="installation_of_heat_recovery_systems"
            class="radio radio-xs"
          />
          No
        </label>
      </div>
    </fieldset>
    <fieldset class="fieldset">
      <legend class="fieldset-legend">
        Total cooling load for chiller system<span
          class="text-[var(--state--error--base)]"
          >*</span
        >
      </legend>
      <label class="input validator w-full">
        <input type="text" placeholder="eg. 342" name="total_chiller_system" />
      </label>
      <p class="validator-hint">This field is required</p>
    </fieldset>
    <fieldset class="fieldset">
      <legend class="fieldset-legend">Baseline leakage factor</legend>
      <label class="input validator w-full">
        <input type="number" placeholder="eg. 2" name="baseline_leakage_factor" />
        <span class="text-sm/5 align-middle text-[var(--text--sub-600)]"
          >%</span
        >
      </label>
      <p class="validator-hint">This field is required</p>
    </fieldset>
    <fieldset class="fieldset col-span-2">
      <legend class="fieldset-legend">
        Annual operating schedule<span
          data-icon="info-custom-fill"
          data-size="20"
          data-color="var(--icon--disabled-300)"
        ></span>
      </legend>
      <div class="w-full flex gap-1.5 items-center">
        <div class="flex-1">
          <label class="input validator w-full">
            <input type="number" placeholder="eg. 1" name="annual_operating_hours_per_day" required />
            <span class="text-sm/5 align-middle text-[var(--text--sub-600)]"
              >Hours / day</span
            >
          </label>
        </div>
        <div class="flex-1">
          <label class="input validator w-full">
            <input type="number" placeholder="eg. 1" name="annual_operating_days_per_week" required />
            <span class="text-sm/5 align-middle text-[var(--text--sub-600)]"
              >days / week</span
            >
          </label>
        </div>
        <div class="flex-1">
          <label class="input validator w-full">
            <input type="number" placeholder="eg. 1" name="annual_operating_weeks_per_year" required />
            <span class="text-sm/5 align-middle text-[var(--text--sub-600)]"
              >weeks / year</span
            >
          </label>
        </div>
      </div>
    </fieldset>
    <fieldset class="fieldset col-span-2">
      <legend class="fieldset-legend">
        Baseline Air Cooled/Water Cooled Chiller Cooling Efficiency
      </legend>
      <label class="input w-full">
        <input type="number" placeholder="eg. 2" name="baseline_cooling_efficiency" />
      </label>
    </fieldset>
    <div class="col-span-2 mt-3">
      <div class="collapse rounded-none">
        <input type="checkbox" class="peer" />
        <div
          class="group collapse-title p-2.5 bg-[var(--bg--weak-50)] text-[0.813rem]/5 font-semibold flex items-center justify-between rounded-[var(--radius-4)]"
        >
          OTHER DETAILS
          <span
            data-icon="caret-down"
            data-size="16"
            data-color="var(--icon--soft-400)"
            class="transition-transform duration-300 ease-in-out group-[peer:checked]:rotate-180"
          ></span>
        </div>
        <div class="collapse-content mt-4 px-0">
          <div class="grid grid-cols-2 gap-2">
            <fieldset class="fieldset">
              <legend class="fieldset-legend">
                Number of chillers<span class="text-[var(--text--sub-600)]"
                  >(Optional)</span
                >
              </legend>
              <label class="input w-full">
                <input type="number" placeholder="eg. 2" name="number_of_chillers" />
              </label>
            </fieldset>
            <fieldset class="fieldset">
              <legend class="fieldset-legend">
                Total chiller system power input<span
                  class="text-[var(--text--sub-600)]"
                  >(Optional)</span
                >
              </legend>
              <label class="input w-full">
                <input type="number" placeholder="eg. 2000" name="total_chiller_system_power_input" />
                <span class="text-sm/5 align-middle text-[var(--text--sub-600)]"
                  >kWH</span
                >
              </label>
            </fieldset>
            <fieldset class="fieldset col-span-2">
              <legend class="fieldset-legend">
                Water-cooled chiller cooling load factor<span
                  class="text-[var(--text--sub-600)]"
                  >(Optional) %</span
                >
              </legend>
              <label class="input w-full">
                <input type="number" placeholder="eg. 45" name="water_cooled_chiller_cooling_load_factor" />
                <span class="text-sm/5 align-middle text-[var(--text--sub-600)]"
                  >%</span
                >
              </label>
            </fieldset>
            <fieldset class="fieldset">
              <legend class="fieldset-legend">COP</legend>
              <label class="input w-full">
                <input type="number" placeholder="eg. 2" name="cop" />
              </label>
            </fieldset>
            <fieldset class="fieldset">
              <legend class="fieldset-legend">IPVL</legend>
              <label class="input w-full">
                <input type="number" placeholder="eg. 2" name="ipvl" />
              </label>
            </fieldset>
            <fieldset class="fieldset">
              <legend class="fieldset-legend">Energy efficiency label</legend>
              <select class="select w-full" name="energy_efficiency_label">
                <option disabled selected value="">Select an option</option>
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
                <option value="D">D</option>
                <option value="E">E</option>
                <option value="F">F</option>
                <option value="G">G</option>
              </select>
            </fieldset>
            <fieldset class="fieldset">
              <legend class="fieldset-legend">Number of stars</legend>
              <select class="select w-full" name="number_of_stars">
                <option disabled selected value="">Select an option</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
              </select>
            </fieldset>
            <fieldset class="fieldset col-span-2">
              <legend class="fieldset-legend">
                Total energy consumption of chiller system anually (kwh/year)
              </legend>
              <label class="input w-full">
                <input type="number" placeholder="eg. 200" name="total_energy_consumption_of_chiller_system_annually" />
                <span class="text-sm/5 align-middle text-[var(--text--sub-600)]"
                  >kWh/year</span
                >
              </label>
            </fieldset>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>

<template id="air-condition-system-template">
  <div
    class="px-5 py-1.5 text-[var(--text--soft-400)] bg-[var(--bg--weak-50)] text-xs/4"
  >
    AIR CONDITION SYSTEM DATA
  </div>
  <div class="px-5 py-4 grid grid-cols-2 gap-x-2.5 gap-y-1">
    <fieldset class="fieldset">
      <legend class="fieldset-legend">
        Type of air condition<span class="text-[var(--state--error--base)]"
          >*</span
        >
      </legend>
      <select class="select w-full" name="type_of_air_condition">
        <option disabled selected value="">Select an option</option>
        <option value="split">Split air condition</option>
        <option value="VRV">
          Variable Refrigerant Volume (VRV) / Variable Refrigerant Flow (VRF)
        </option>

    <fieldset class="fieldset">

        <option value="R-404A">R-404A</option>

      <legend class="fieldset-legend">
        Refrigerant quantity<span class="text-[var(--state--error--base)]"

        ><span class="text-[var(--text--sub-600)]">(kg)</span>
      </legend>
      <label class="input validator w-full">
        <input type="number" placeholder="eg.  134" name="refrigerant_quantity" />
        <span class="text-sm/5 align-middle text-[var(--text--sub-600)]"
          >kg</span

      <p class="validator-hint">This field is required</p>
    </fieldset>
    <fieldset class="fieldset">
      <legend class="fieldset-legend">

          class="text-[var(--state--error--base)]"

        >
      </legend>
      <label class="input validator w-full">

        >
          OTHER DETAILS
          <span
            data-icon="caret-down"

          ></span>

              </legend>
              <label class="input w-full">

            </fieldset>
            <fieldset class="fieldset">
              <legend class="fieldset-legend">
                Total split unit//VRV system
              </legend>

                <span class="text-sm/5 align-middle text-[var(--text--sub-600)]"
                  >kW</span
                >
              </label>
            </fieldset>

              <legend class="fieldset-legend">
                Total energy consumption of chiller system annually<span
                  class="text-[var(--text--sub-600)]"
                  >(kWh/year)</span
                >
              </legend>
              <label class="input w-full">
                <input type="number" placeholder="eg. 200" name="total_chiller_system_annually" />
                <span class="text-sm/5 align-middle text-[var(--text--sub-600)]"
                  >%</span
                >
              </label>
            </fieldset>
            <fieldset class="fieldset col-span-2">
              <legend class="fieldset-legend">
                Baseline split unit/VRV system efficiency
              </legend>
              <label class="input w-full">
                <input type="number" placeholder="eg. 333" name="baseline_split_unit_vrv_system_efficiency" />
                <span class="text-sm/5 align-middle text-[var(--text--sub-600)]"
                  >watt</span
                >
              </label>
            </fieldset>
            <fieldset class="fieldset">
              <legend class="fieldset-legend">ISSER rating</legend>
              <label class="input w-full">
                <input type="number" placeholder="eg. 4.5" name="isser_rating" />
              </label>
            </fieldset>
            <fieldset class="fieldset">
              <legend class="fieldset-legend">COP</legend>
              <label class="input w-full">
                <input type="number" placeholder="eg. 2" name="cop" />
              </label>
            </fieldset>

            <fieldset class="fieldset">
              <legend class="fieldset-legend">Energy efficiency label</legend>
              <select class="select w-full" name="energy_efficiency_label">
                <option disabled selected value="">Select an option</option>
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
                <option value="D">D</option>
                <option value="E">E</option>
                <option value="F">F</option>
                <option value="G">G</option>
              </select>
            </fieldset>
            <fieldset class="fieldset">
              <legend class="fieldset-legend">Number of stars</legend>
              <select class="select w-full" name="number_of_stars">
                <option disabled selected value="">Select an option</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
              </select>
            </fieldset>
            <fieldset class="fieldset col-span-2">
              <legend class="fieldset-legend">
                Total energy consumption of chiller system anually (kwh/year)
              </legend>
              <label class="input w-full">
                <input type="number" placeholder="eg. 200" name="total_chiller_system_annually" />
                <span class="text-sm/5 align-middle text-[var(--text--sub-600)]"
                  >kWh/year</span
                >
              </label>
            </fieldset>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>

<script>
  // Store cooling systems data on window to make it globally accessible
  if (!window.coolingSystems) {
    window.coolingSystems = [];
  }
  if (!window.editingSystemIndex) {
    window.editingSystemIndex = null;
  }

  // Open modal for adding new system
  window.openCoolingSystemModal = function() {
    window.editingSystemIndex = null;
    document.getElementById('cooling-system-form').reset();
    document.getElementById('selected-cooling-system').innerHTML = '';
    cooling_system_modal.showModal();
  }

  // Close modal
  window.closeCoolingSystemModal = function() {
    cooling_system_modal.close();
    window.editingSystemIndex = null;
  }

  // Handle cooling system type change
  window.handleCoolingSystemTypeChange = function(systemType) {
    const selectedSystemDiv = document.getElementById('selected-cooling-system');
    
    if (!systemType) {
      selectedSystemDiv.innerHTML = '';
      return;
    }

    // Get the selected option text
    const selectElement = document.getElementById('cooling-system-type');
    const selectedText = selectElement.options[selectElement.selectedIndex].text;

    // Determine which template to load based on system type
    if (selectedText.toLowerCase().includes('chiller')) {
      loadTemplate('chiller-system-template', selectedSystemDiv);
    } else {
      loadTemplate('air-condition-system-template', selectedSystemDiv);
    }

    // Reinitialize icons after loading template
    if (window.IconComponent) {
      window.IconComponent.initialize();
    }
  }

  // Load template content
  function loadTemplate(templateId, targetElement) {
    const template = document.getElementById(templateId);
    if (template) {
      targetElement.innerHTML = template.innerHTML;
    }
  }

  // Save cooling system
  window.saveCoolingSystem = function() {
    const form = document.getElementById('cooling-system-form');
    const formData = new FormData(form);
    
    // Get cooling system type
    const systemTypeSelect = document.getElementById('cooling-system-type');
    const systemType = systemTypeSelect.value;
    const systemTypeName = systemTypeSelect.options[systemTypeSelect.selectedIndex].text;

    if (!systemType) {
      alert('Please select a cooling system type');
      return;
    }

    // Collect all form data
    const systemData = {
      type: systemType,
      typeName: systemTypeName,
      data: {}
    };

    // Get all inputs, selects, and textareas from the form
    const formElements = form.querySelectorAll('input, select, textarea');
    formElements.forEach(element => {
      if (element.name && element.name !== 'cooling-system-type') {
        if (element.type === 'radio') {
          if (element.checked) {
            systemData.data[element.name] = element.value || 'Yes';
          }
        } else if (element.type === 'checkbox') {
          systemData.data[element.name] = element.checked;
        } else {
          systemData.data[element.name] = element.value;
        }
      }
    });

    // Add or update system
    if (window.editingSystemIndex !== null) {
      window.coolingSystems[window.editingSystemIndex] = systemData;
    } else {
      window.coolingSystems.push(systemData);
    }

    // Update the list display
    window.renderCoolingSystems();

    // Close modal
    window.closeCoolingSystemModal();

    // Emit form status for step validation
    if (typeof StepManager !== 'undefined') {
      StepManager.emitFormStatus(window.coolingSystems.length > 0, {
        cooling_systems: window.coolingSystems
      }, window.stepManager.getCurrentStepKey() );
    }
  }

  // Render cooling systems list
  window.renderCoolingSystems = function() {
    const listContainer = document.getElementById('cooling-systems-list');
    
    if (window.coolingSystems.length === 0) {
      listContainer.innerHTML = `
        <li class="flex flex-col items-center justify-center py-8 text-center">
          <span data-icon="snowflake-fill" data-size="48" data-color="var(--icon--soft-400)"></span>
          <p class="text-sm/5 text-[var(--text--sub-600)] mt-2">No cooling systems added yet</p>
        </li>
      `;
      if (window.IconComponent) {
        window.IconComponent.initialize();
      }
      return;
    }

    listContainer.innerHTML = window.coolingSystems.map((system, index) => {
      // Extract key details for display
      const refrigerantType = system.data['type_of_refrigerants'] || 'N/A';
      const refrigerantQty = system.data['refrigerant_quantity'] || 'N/A';
      const chillerType = system.data['chiller_system'] || system.data['type_of_air_condition'] || '';
      
      return `
        <li class="flex items-center justify-between gap-1.5 w-full p-2.5 rounded-[var(--radius-8)] bg-[var(--bg--weak-50)] border border-[var(--stroke--soft-200)]">
          <span
            data-icon="snowflake-fill"
            data-size="20"
            data-color="var(--icon--strong-950)"
            class="shrink-0 self-start"
          ></span>
          <div class="flex flex-col flex-1">
            <p class="text-sm/5 font-medium">
              ${system.typeName}${chillerType ? ' - ' + chillerType : ''}
            </p>
            <p class="text-sm/5 text-[var(--text--sub-600)] gap-0">
              <span class="border-r border-[var(--text--sub-600)] pr-1">Type: ${refrigerantType}</span>
              <span>Refrigerant quantity: ${refrigerantQty} kg</span>
            </p>
          </div>
          <div class="flex items-center gap-3">
            <button class="btn size-5 btn-ghost p-0" onclick="editCoolingSystem(${index})">
              <span
                data-icon="edit-line"
                data-size="16"
                data-color="var(--icon--strong-950)"
              ></span>
            </button>
            <button
              class="btn size-5 btn-ghost p-0"
              onclick="confirmDeleteCoolingSystem(${index})"
            >
              <span
                data-icon="delete-bin-5-line"
                data-size="16"
                data-color="var(--icon--strong-950)"
              ></span>
            </button>
          </div>
        </li>
      `;
    }).join('');

    // Reinitialize icons
    if (window.IconComponent) {
      window.IconComponent.initialize();
    }
  }

  // Edit cooling system
  window.editCoolingSystem = function(index) {
    window.editingSystemIndex = index;
    const system = window.coolingSystems[index];

    // Reset form
    document.getElementById('cooling-system-form').reset();

    // Set system type
    const systemTypeSelect = document.getElementById('cooling-system-type');
    systemTypeSelect.value = system.type;

    // Trigger change to load the appropriate template
    window.handleCoolingSystemTypeChange(system.type);

    // Wait a bit for template to load, then populate fields
    setTimeout(() => {
      const form = document.getElementById('cooling-system-form');
      
      // Populate all form fields
      Object.keys(system.data).forEach(fieldName => {
        const field = form.querySelector(`[name="${fieldName}"]`);
        if (field) {
          if (field.type === 'radio') {
            const radioButton = form.querySelector(`[name="${fieldName}"][value="${system.data[fieldName]}"]`);
            if (radioButton) radioButton.checked = true;
          } else if (field.type === 'checkbox') {
            field.checked = system.data[fieldName];
          } else {
            field.value = system.data[fieldName];
          }
        }
      });
    }, 100);

    cooling_system_modal.showModal();
  }

  // Confirm delete
  if (!window.deleteSystemIndex) {
    window.deleteSystemIndex = null;
  }
  
  window.confirmDeleteCoolingSystem = function(index) {
    window.deleteSystemIndex = index;
    cooling_system_modal_delete.showModal();
  }

  // Delete cooling system
  window.deleteCoolingSystem = function() {
    if (window.deleteSystemIndex !== null) {
      window.coolingSystems.splice(window.deleteSystemIndex, 1);
      window.renderCoolingSystems();
      window.deleteSystemIndex = null;
      cooling_system_modal_delete.close();

      // Emit form status for step validation
      if (typeof StepManager !== 'undefined') {
        StepManager.emitFormStatus(window.coolingSystems.length > 0, {
          cooling_systems: window.coolingSystems
        }, window.stepManager.getCurrentStepKey() );
      }
    }
  }

  // Initialize on page load
  document.addEventListener('DOMContentLoaded', function() {
    window.renderCoolingSystems();
  });

  // If HTMX is processing this content dynamically, also initialize after htmx:afterSwap
  document.addEventListener('htmx:afterSwap', function(evt) {
    if (evt.detail.target.id === 'dynamic-content') {
      window.renderCoolingSystems();
    }
  });

  // Initialize immediately for dynamically loaded content
  if (document.getElementById('cooling-systems-list')) {
    window.renderCoolingSystems();
  }
</script>

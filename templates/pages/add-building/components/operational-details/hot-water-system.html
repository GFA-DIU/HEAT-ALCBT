{% load static %}
<div id="hot-water-system-container" class="w-full">
  <div class="w-full flex flex-col">
    <button class="btn btn-outline w-fit" onclick="openHotWaterSystemModal()">
      <span data-icon="add-large-fill" data-size="20" data-color="var(--icon--strong-950)"></span>
      Add hot water system
    </button>
    <div class="divider before:h-[0.0625rem] after:h-[0.0625rem] before:bg-[var(--stroke--soft-200)] after:bg-[var(--stroke--soft-200)]"></div>
    <ul id="hot-water-systems-list" class="grid grid-cols-1 gap-2"></ul>
  </div>
</div>

<dialog id="hot_water_system_modal" class="modal modal-bottom sm:modal-end">
  <div class="modal-box p-0 !h-[97vh] my-auto mr-3.5 !w-full !max-w-[40.375rem] rounded-[1.25rem] overflow-y-auto flex flex-col justify-between">
    <div class="flex justify-between p-5 w-full">
      <div class="flex flex-col">
        <h3 class="text-lg/6 font-medium">Add a hot water system</h3>
        <p class="text-sm/5 text-[var(--text--sub-600)]">Provide details on the building's method of producing and distributing hot water.</p>
      </div>
      <button type="button" onclick="closeHotWaterSystemModal()" class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">
        <span data-icon="close-line" data-size="16" data-color="var(--icon--sub-600)"></span>
      </button>
    </div>
    <form id="hot-water-system-form" class="flex-1 overflow-y-auto hide-scrollbar">
      {% csrf_token %}
      <div class="px-5 py-4">
        <fieldset class="fieldset">
          <legend class="fieldset-legend">Type of hot water system<span class="text-[var(--state--error--base)]">*</span></legend>
          <select class="select w-full" id="hot-water-type-select" name="type_of_hot_water_system"
            hx-get="/select_lists/?hot_water_system_types=1"
            hx-trigger="load"
            hx-target="this"
            hx-swap="innerHTML"
            onchange="handleHotWaterTypeChange(this.value)"
            required>
            <option value="">Select a hot water system</option>
          </select>
        </fieldset>
      </div>
      <div id="selected-hot-water-system"></div>
    </form>
    <div class="p-5 border-t border-[var(--stroke--soft-200)] flex gap-4 items-center justify-between w-full">
      <button type="button" class="btn flex-1 btn-sm btn-outline text-[var(--text--sub-600)] border-[var(--stroke--soft-200)]" onclick="closeHotWaterSystemModal()">Cancel</button>
      <button type="button" class="btn flex-1 btn-sm btn-primary" onclick="saveHotWaterSystem()">Save</button>
    </div>
  </div>
</dialog>

<dialog id="hot_water_system_modal_delete" class="modal modal-middle">
  <div class="modal-box w-full max-w-[26.375rem] p-0">
    <div class="flex flex-col items-center p-5">
      <div class="flex items-center p-2 justify-center rounded-[var(--radius-8)] bg-[var(--state--warning--lighter)]">
        <span data-icon="alert-fill" data-size="24" data-color="var(--state--warning--base)"></span>
      </div>
      <h3 class="text-lg/6 font-medium mt-4">Are you sure?</h3>
      <p class="text-sm/5 text-[var(--text--sub-600)] text-center mt-1">You are about to permanently remove this hot water system.</p>
    </div>
    <div class="p-5 border-t border-[var(--stroke--soft-200)] flex gap-4 items-center justify-between w-full">
      <button class="btn btn-sm btn-outline text-[var(--text--sub-600)] border-[var(--stroke--soft-200)] flex-1" onclick="hot_water_system_modal_delete.close()">Cancel</button>
      <button class="btn btn-sm btn-error flex-1" onclick="deleteHotWaterSystem()">Remove</button>
    </div>
  </div>
</dialog>

<template id="no-hot-water-system-template">
  <div class="w-full flex flex-col gap-3 items-center justify-center">
    <img src="{% static 'assets/hot-water-system.png' %}" alt="Hot Water System Image" />
    <p class="text-sm/5 font-medium">Click button below to add a hot water system</p>
    <button class="btn btn-primary" onclick="hot_water_system_modal.showModal()">Add hot water system</button>
  </div>
</template>

<!-- ============================================================
     PER-TYPE TEMPLATES
     ============================================================ -->

<!-- Heat Pump Water Heater -->
<template id="heat-pump-template">
  <div class="px-5 py-1.5 text-[var(--text--soft-400)] bg-[var(--bg--weak-50)] text-xs/4">HEAT PUMP WATER HEATER DATA</div>
  <div class="px-5 py-4 grid grid-cols-2 gap-x-2.5 gap-y-1">

    <fieldset class="fieldset">
      <legend class="fieldset-legend">Fuel type<span class="text-[var(--state--error--base)]">*</span></legend>
      <select class="select w-full" name="fuel_type"
        hx-get="/select_lists/?fuel_types=1"
        hx-trigger="load"
        hx-target="this"
        hx-swap="innerHTML"
        required>
        <option value="">Select an option</option>
      </select>
    </fieldset>

    <fieldset class="fieldset">
      <legend class="fieldset-legend">Number of hot water equipment<span class="text-[var(--state--error--base)]">*</span></legend>
      <label class="input validator w-full">
        <input type="number" name="number_of_equipment" placeholder="e.g. 2" required min="1" />
      </label>
    </fieldset>

    <fieldset class="fieldset col-span-2">
      <legend class="fieldset-legend">System operating schedule<span data-icon="info-custom-fill" data-size="20" data-color="var(--icon--disabled-300)"></span></legend>
      <div class="w-full flex gap-1.5 items-center">
        <div class="flex-1">
          <label class="input validator w-full">
            <input type="number" name="operating_hours_per_day" placeholder="4" value="4" required min="1" max="24" />
            <span class="text-sm/5 align-middle text-[var(--text--sub-600)]">hrs / day</span>
          </label>
        </div>
        <div class="flex-1">
          <label class="input validator w-full">
            <input type="number" name="operating_days_per_week" placeholder="7" value="7" required min="1" max="7" />
            <span class="text-sm/5 align-middle text-[var(--text--sub-600)]">days / week</span>
          </label>
        </div>
        <div class="flex-1">
          <label class="input validator w-full">
            <input type="number" name="operating_weeks_per_year" placeholder="52" value="52" required min="1" max="52" />
            <span class="text-sm/5 align-middle text-[var(--text--sub-600)]">weeks / year</span>
          </label>
        </div>
      </div>
    </fieldset>

    <fieldset class="fieldset col-span-2">
      <legend class="fieldset-legend">Baseline hot water system efficiency<span class="text-[var(--state--error--base)]">*</span></legend>
      <label class="input validator w-full">
        <input type="number" name="baseline_efficiency" placeholder="2.5–4.5" required min="0" step="0.001" />
        <span class="text-sm/5 align-middle text-[var(--text--sub-600)]">COP</span>
      </label>
      <p class="validator-hint">Typical: 2.5–4.5 for heat pumps</p>
    </fieldset>

    <fieldset class="fieldset col-span-2">
      <legend class="fieldset-legend">Installation of heat recovery system<span class="text-[var(--state--error--base)]">*</span></legend>
      <div class="flex items-center gap-2.5 mt-1">
        <label class="flex items-center gap-2"><input type="radio" name="heat_recovery_system" value="yes" class="radio radio-xs" /> Yes</label>
        <label class="flex items-center gap-2"><input type="radio" name="heat_recovery_system" value="no" class="radio radio-xs" /> No</label>
      </div>
    </fieldset>

    <fieldset class="fieldset col-span-2">
      <legend class="fieldset-legend">Baseline hot water system equipment efficiency level<span class="text-[var(--state--error--base)]">*</span></legend>
      <label class="input validator w-full">
        <input type="number" name="equipment_efficiency_level" placeholder="75–95" required min="0" max="100" step="0.01" />
        <span class="text-sm/5 align-middle text-[var(--text--sub-600)]">%</span>
      </label>
      <p class="validator-hint">Typical: 75%–95%</p>
    </fieldset>

  </div>

  <div class="px-5 pb-4">
    <div class="collapse collapse-arrow border border-[var(--stroke--soft-200)] rounded-[var(--radius-8)]">
      <input type="checkbox" />
      <div class="collapse-title text-sm/5 font-medium px-4 py-3 min-h-0">Other details</div>
      <div class="collapse-content px-4 grid grid-cols-2 gap-x-2.5 gap-y-1">

        <fieldset class="fieldset col-span-2">
          <legend class="fieldset-legend">Hot water system power input</legend>
          <label class="input w-full">
            <input type="number" name="power_input" placeholder="2–15" min="0" step="0.01" />
            <span class="text-sm/5 align-middle text-[var(--text--sub-600)]">kW</span>
          </label>
          <p class="label-text-alt text-[var(--text--soft-400)]">Typical: 2–15 kW for heat pumps</p>
        </fieldset>

        <fieldset class="fieldset col-span-2">
          <legend class="fieldset-legend">Total energy consumption annually</legend>
          <label class="input w-full">
            <input type="number" name="total_energy_consumption_kwh_per_year" placeholder="e.g. 1092" min="0" />
            <span class="text-sm/5 align-middle text-[var(--text--sub-600)]">kWh/year</span>
          </label>
          <p class="label-text-alt text-[var(--text--soft-400)]">Default: efficiency level × hrs/day × days/week × weeks/year</p>
        </fieldset>

      </div>
    </div>
  </div>
</template>

<script>
  var HWS_TYPE_MAP = {
    'heat-pump': 'heat-pump-template',
    'boiler':    'boiler-template',
    'solar':     'solar-template',
  };

  // ================================================================
  // Handle type change — load per-type template
  // ================================================================
  window.handleHotWaterTypeChange = function(typeValue) {
    var container = document.getElementById('selected-hot-water-system');
    container.innerHTML = '';

    if (!typeValue) return;

    var templateId = HWS_TYPE_MAP[typeValue];
    if (!templateId) return;

    var tmpl = document.getElementById(templateId);
    if (!tmpl) return;

    var clone = tmpl.content.cloneNode(true);
    container.appendChild(clone);

    // HTMX process newly injected content (for fuel_type hx-get)
    if (window.htmx) htmx.process(container);
  };

  // ================================================================
  // Modal open / close
  // ================================================================
  if (!window.editingHotWaterSystemId) {
    window.editingHotWaterSystemId = null;
  }

  function getCSRFToken() {
    return document.querySelector('[name=csrfmiddlewaretoken]')?.value || '';
  }

  function getBuildingId() {
    var urlParams = new URLSearchParams(window.location.search);
    return urlParams.get('building_uuid');
  }

  window.openHotWaterSystemModal = function() {
    window.editingHotWaterSystemId = null;
    var form = document.getElementById('hot-water-system-form');
    form.reset();
    document.getElementById('selected-hot-water-system').innerHTML = '';
    document.getElementById('hot-water-type-select').value = '';
    hot_water_system_modal.showModal();
  };

  window.closeHotWaterSystemModal = function() {
    hot_water_system_modal.close();
    window.editingHotWaterSystemId = null;
  };

  // ================================================================
  // Save
  // ================================================================
  window.saveHotWaterSystem = async function() {
    var form = document.getElementById('hot-water-system-form');

    var buildingId = getBuildingId();
    if (!buildingId) {
      Toast.error('Building ID not found. Please save building information first.');
      return;
    }

    var validator = new window.FormValidator(form);
    if (!validator.validate()) {
      console.error('Form validation failed', validator.errors);
      return;
    }

    var formData = new FormData(form);
    var systemData = Object.fromEntries(formData.entries());
    systemData.building_uuid = buildingId;

    if (window.editingHotWaterSystemId) {
      systemData.hot_water_system_id = window.editingHotWaterSystemId;
    }

    try {
      var response = await fetch('/hot-water-system/', {
        method: window.editingHotWaterSystemId ? 'PUT' : 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': getCSRFToken()
        },
        body: JSON.stringify(systemData)
      });

      var result = await response.json();

      if (response.ok && result.success) {
        await window.renderHotWaterSystems();
        window.closeHotWaterSystemModal();
      } else {
        Toast.error('Error saving hot water system:\n' + JSON.stringify(result.errors || result.error));
      }
    } catch (error) {
      console.error('Error saving hot water system:', error);
      Toast.error('Failed to save hot water system. Please try again.');
    }
  };

  // ================================================================
  // Render list
  // ================================================================
  window.renderHotWaterSystems = async function() {
    var listContainer = document.getElementById('hot-water-systems-list');
    var noSystemsTemplate = document.getElementById('no-hot-water-system-template');

    var buildingId = getBuildingId();
    if (!buildingId) {
      console.error('Building ID not found');
      return;
    }

    try {
      var response = await fetch('/hot-water-system/' + buildingId + '/');
      var result = await response.json();

      if (!response.ok || !result.success) {
        console.error('Failed to load hot water systems');
        return;
      }

      var systems = result.hot_water_systems || [];

      if (systems.length === 0) {
        listContainer.innerHTML = noSystemsTemplate.innerHTML;
        return;
      }

      listContainer.innerHTML = systems.map(function(system) {
        var fuelType   = system.fuel_type_display || 'N/A';
        var powerInput = system.power_input !== null ? system.power_input + ' kW' : 'N/A';

        return '<li class="flex items-center justify-between gap-1.5 w-full p-2.5 rounded-[var(--radius-8)] bg-[var(--bg--weak-50)] border border-[var(--stroke--soft-200)]">'
          + '<span data-icon="temp-cold-line" data-size="20" data-color="var(--icon--strong-950)" class="shrink-0 self-start"></span>'
          + '<div class="flex flex-col flex-1">'
          + '<p class="text-sm/5 font-medium">' + system.type_of_hot_water_system_display + '</p>'
          + '<p class="text-sm/5 text-[var(--text--sub-600)] gap-0">'
          + '<span class="border-r border-[var(--text--sub-600)] pr-1">Fuel type: ' + fuelType + '</span>'
          + '<span class="pl-1">Power input: ' + powerInput + '</span>'
          + '</p>'
          + '</div>'
          + '<div class="flex items-center gap-3">'
          + '<button class="btn size-5 btn-ghost p-0" onclick="editHotWaterSystem(' + system.id + ')">'
          + '<span data-icon="edit-line" data-size="16" data-color="var(--icon--strong-950)"></span>'
          + '</button>'
          + '<button class="btn size-5 btn-ghost p-0" onclick="confirmDeleteHotWaterSystem(' + system.id + ')">'
          + '<span data-icon="delete-bin-5-line" data-size="16" data-color="var(--icon--strong-950)"></span>'
          + '</button>'
          + '</div>'
          + '</li>';
      }).join('');

      if (window.initIcons) window.initIcons();
    } catch (error) {
      console.error('Error loading hot water systems:', error);
      listContainer.innerHTML = '<li class="flex flex-col items-center justify-center py-8 text-center">'
        + '<span data-icon="error-warning-fill" data-size="48" data-color="var(--state--error--base)"></span>'
        + '<p class="text-sm/5 text-[var(--text--sub-600)] mt-2">Error loading hot water systems</p>'
        + '</li>';
    }
  };

  // ================================================================
  // Edit
  // ================================================================
  window.editHotWaterSystem = async function(systemId) {
    window.editingHotWaterSystemId = systemId;

    var buildingId = getBuildingId();
    if (!buildingId) {
      Toast.error('Building ID not found');
      return;
    }

    try {
      var response = await fetch('/hot-water-system/' + buildingId + '/');
      var result = await response.json();

      if (!response.ok || !result.success) {
        Toast.error('Failed to load hot water system');
        return;
      }

      var system = result.hot_water_systems.find(function(s) { return s.id === systemId; });
      if (!system) {
        Toast.error('Hot water system not found');
        return;
      }

      var form = document.getElementById('hot-water-system-form');
      form.reset();
      document.getElementById('selected-hot-water-system').innerHTML = '';

      // Set type and load template
      var typeSelect = document.getElementById('hot-water-type-select');
      if (typeSelect) {
        typeSelect.value = system.type_of_hot_water_system;
        handleHotWaterTypeChange(system.type_of_hot_water_system);
      }

      var setField = function(name, value) {
        var el = form.querySelector('[name="' + name + '"]');
        if (el && value !== null && value !== undefined) el.value = value;
      };
      var setRadio = function(name, value) {
        form.querySelectorAll('[name="' + name + '"]').forEach(function(r) {
          r.checked = (r.value === value);
        });
      };
      var populateFields = function() {
        setField('fuel_type', system.fuel_type);
        setField('number_of_equipment', system.number_of_equipment);
        setField('operating_hours_per_day', system.operating_hours_per_day);
        setField('operating_days_per_week', system.operating_days_per_week);
        setField('operating_weeks_per_year', system.operating_weeks_per_year);
        setField('baseline_efficiency', system.baseline_efficiency);
        setRadio('heat_recovery_system', system.heat_recovery_system ? 'yes' : 'no');
        setField('equipment_efficiency_level', system.equipment_efficiency_level);
        setField('power_input', system.power_input);
        setField('total_energy_consumption_kwh_per_year', system.total_energy_consumption_kwh_per_year);
      };

      // fuel_type select: if it uses hx-get (heat-pump / boiler), wait for HTMX to finish loading options
      var fuelSelect = form.querySelector('[name="fuel_type"]');
      if (fuelSelect && fuelSelect.hasAttribute('hx-get')) {
        fuelSelect.addEventListener('htmx:afterSwap', function onFuelLoaded() {
          fuelSelect.removeEventListener('htmx:afterSwap', onFuelLoaded);
          populateFields();
        });
      } else {
        // Solar or any static select — populate immediately
        populateFields();
      }

      hot_water_system_modal.showModal();
    } catch (error) {
      console.error('Error loading hot water system for edit:', error);
      Toast.error('Failed to load hot water system');
    }
  };

  // ================================================================
  // Delete
  // ================================================================
  if (!window.deleteHotWaterSystemId) {
    window.deleteHotWaterSystemId = null;
  }

  window.confirmDeleteHotWaterSystem = function(systemId) {
    window.deleteHotWaterSystemId = systemId;
    hot_water_system_modal_delete.showModal();
  };

  window.deleteHotWaterSystem = async function() {
    if (window.deleteHotWaterSystemId !== null) {
      try {
        var response = await fetch('/hot-water-system/' + window.deleteHotWaterSystemId + '/delete/', {
          method: 'DELETE',
          headers: { 'X-CSRFToken': getCSRFToken() }
        });

        var result = await response.json();

        if (response.ok && result.success) {
          await window.renderHotWaterSystems();
          window.deleteHotWaterSystemId = null;
          hot_water_system_modal_delete.close();
        } else {
          Toast.error('Failed to delete hot water system');
        }
      } catch (error) {
        console.error('Error deleting hot water system:', error);
        Toast.error('Failed to delete hot water system');
      }
    }
  };

  // ================================================================
  // Initialize
  // ================================================================
  document.addEventListener('DOMContentLoaded', function() {
    window.renderHotWaterSystems();
  });

  document.addEventListener('htmx:afterSwap', function(evt) {
    if (evt.detail.target.id === 'dynamic-content') {
      window.renderHotWaterSystems();
    }
  });

  if (document.getElementById('hot-water-systems-list')) {
    window.renderHotWaterSystems();
  }
</script>

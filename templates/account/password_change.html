{% extends 'account/_auth.html' %}
{% load crispy_forms_tags %}
{% load i18n %}

{% block title %}{% translate "Change Password" %}{% endblock %}

{% block auth_content %}
<h1 class="text-xl font-bold text-center text-(--text--strong-950)">{% translate "Change Password" %}</h1>
<form method="post" action="{% url 'account_change_password' %}">
  {% csrf_token %}
  {{ form|crispy }}
  <button class="btn btn-success" type="submit">{% translate "Change Password" %}</button>
</form>
{% endblock auth_content %}
